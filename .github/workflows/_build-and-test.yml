name: Build and test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
      MSBUILDDISABLENODEREUSE: '1'
      UseSharedCompilation: 'false'
      MalievWorkspaceRoot: ${{ github.workspace }}/.dependencies
      MALIEV_WEB_STARTUP_PROOF: hosted-owned
      MALIEV_BILLING_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      MALIEV_BROWSER_EVIDENCE_DIR: ${{ github.workspace }}/sidebar-navigation-test-results
    steps:
      - name: Check out Web
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check out Legacy.Maliev.ServiceDefaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: 4ffba0639620e7e923d331317f3f28501526b573
          path: .dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Check out Legacy.Maliev.CompatibilityContracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
          path: .dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Verify offline Search Console cohort reporter
        shell: pwsh
        run: ./tests/SearchConsoleCohortReport.Tests.ps1
      - name: Set up original Career oracle runtime
        timeout-minutes: 5
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 8.0.x
      - name: Build original Career materialization oracle
        timeout-minutes: 5
        run: >-
          dotnet build acceptance/CareerOriginalMaterialization/CareerOriginalMaterialization.Tests.csproj
          --configuration Release --disable-build-servers -warnaserror
          -p:UseSharedCompilation=false -nodeReuse:false
      - name: Verify original Career materialization oracle
        timeout-minutes: 5
        run: >-
          dotnet test acceptance/CareerOriginalMaterialization/CareerOriginalMaterialization.Tests.csproj
          --configuration Release --no-build --no-restore --disable-build-servers
          -p:UseSharedCompilation=false -nodeReuse:false
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --logger trx --results-directory ./career-original-materialization-test-results
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Legacy.Maliev.Web/package-lock.json
      - name: Build deterministic browser assets
        working-directory: Legacy.Maliev.Web
        run: npm run ci
      - name: Verify committed browser assets
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- Legacy.Maliev.Web/wwwroot/dist Legacy.Maliev.Web/wwwroot/src/vendor/three
          untracked="$(git ls-files --others -- Legacy.Maliev.Web/wwwroot/dist Legacy.Maliev.Web/wwwroot/src/vendor/three)"
          if [ -n "$untracked" ]; then
            echo 'Unexpected untracked generated public output.' >&2
            exit 1
          fi
      - name: Verify frozen source-parity manifest
        shell: pwsh
        run: ./scripts/verify-complete-source-history-parity.ps1 -ManifestOnly
      - name: Build exact-pinned disposable profile boundary services
        shell: pwsh
        run: ./scripts/prepare-profile-producer-boundary.ps1
      - name: Build exact-pinned disposable member authentication proof
        shell: pwsh
        run: ./scripts/prepare-member-auth-indexing-proof.ps1
      - name: Build exact-pinned Catalog for member billing persistence proof
        shell: pwsh
        run: ./scripts/prepare-billing-catalog-proof.ps1
      - name: Build exact-pinned disposable SCB payment boundary service
        shell: pwsh
        run: ./scripts/prepare-scb-payment-boundary.ps1
      - name: Build browser acceptance host
        run: GITHUB_ACTIONS=false dotnet build Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj --configuration Release
      - name: Verify migrated Home Knowledge sitemap copy and asset consumers before browser validation
        timeout-minutes: 10
        run: |
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj \
            --configuration Release --no-build --no-restore \
            -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath= \
            --filter "FullyQualifiedName~PublicCrawlerInventoryAcceptanceTests|FullyQualifiedName~SitemapResponseCachingHttpTests|FullyQualifiedName~KnowledgeGuidelinesStaticSsrRouteTests|FullyQualifiedName~KnowledgeCncMachiningStaticSsrRouteTests|FullyQualifiedName~PublicCopyParityTests|FullyQualifiedName~AssetDeliveryContractTests|FullyQualifiedName~PublicWebpImageContractTests|FullyQualifiedName~AboutPageContractTests|FullyQualifiedName~WebSurfaceTests.HomePage_RendersLocalizedStaticBlazorBodyWithNavigationParity|FullyQualifiedName~WebSurfaceTests.AboutRoute_PreservesLocalizedStaticSsrTimelineWithoutFacebookProfileIntegration|FullyQualifiedName~WebSurfaceTests.Sitemap_PublishesEveryIndexedRouteWithLocalizedAlternates" \
            --logger trx --results-directory ./migration-consumer-test-results
          python3 -B scripts/verify-focused-web-trx.py \
            --directory migration-consumer-test-results --suite migration-consumers \
            --assembly Legacy.Maliev.Web.Tests/bin/Release/net10.0/Legacy.Maliev.Web.Tests.dll
      - name: Verify controlled currency failure boundaries and stage diagnostics
        timeout-minutes: 5
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~AdditiveFxHandlerContractTests"
          --logger trx --results-directory ./fx-handler-test-results
      - name: Verify exact owned-resource refusal and cleanup controls
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~CncOwnedResourceScopeTests|FullyQualifiedName~MaterialPricingAsyncCleanupTests|FullyQualifiedName~WebSurfaceOwnedLifetimeTests|FullyQualifiedName~WebSurfaceTests.MemberQuotationDetail_RendersLocalizedOwnedStaticSsr"
          --logger trx --results-directory ./cnc-resource-test-results
      - name: Verify quotation-only conversions and minimal contact diagnostics
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~LeadAnalyticsEventQueueParityTests|FullyQualifiedName~PublicGoogleTagManagerMigrationTests|FullyQualifiedName~PublicContactRenderedScriptsTests"
          --logger trx --results-directory ./quotation-conversion-test-results
      - name: Verify literal CNC profile writes through the exact composed producer
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~CncLiteralProducerBoundaryTests"
          --logger trx --results-directory ./cnc-literal-producer-test-results
      - name: Verify material pricing progress boundaries
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~InstantQuotationMaterialPricingProgressTests|FullyQualifiedName~MaterialCompletionObservationForwardingTests"
          --logger trx --results-directory ./material-progress-test-results
      - name: Verify protected ticket currency identity
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~ProtectedTicket_NonCanonicalCurrencyOrRate_IsRejected|FullyQualifiedName~IssuedTickets_CanonicalThbIdentityAndEngineerReview_RemainValid"
          --logger trx --results-directory ./ticket-test-results
      - name: Install pinned Chromium browser
        shell: bash
        timeout-minutes: 8
        run: |
          # Use the signed official HTTPS archive after the hosted Azure mirror stalled.
          test -s /etc/apt/apt-mirrors.txt
          python3 -c 'from pathlib import Path; s=Path("/etc/apt/sources.list.d/ubuntu.sources").read_text(); assert "mirror+file:/etc/apt/apt-mirrors.txt" in s and "Signed-By:" in s, "Unexpected hosted Ubuntu source policy"'
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          pwsh -NoProfile -File ./Legacy.Maliev.Web.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Verify focused TRX rejection controls
        run: python3 -B tests/FocusedWebTrxGate.Tests.py
      - name: Verify immutable company asset custody and rejection controls
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p company-asset-custody-results
          python3 -B tests/CompanyReleaseAssetValidator.Tests.py 2>&1 | tee company-asset-custody-results/normal.log
          python3 -B -O tests/CompanyReleaseAssetValidator.Tests.py 2>&1 | tee company-asset-custody-results/optimized.log
          python3 -B scripts/verify_company_release_assets.py | tee company-asset-custody-results/custody.json
          python3 -B tests/KnowledgeAssetIntake.Tests.py 2>&1 | tee company-asset-custody-results/knowledge-intake-normal.log
          python3 -B -O tests/KnowledgeAssetIntake.Tests.py 2>&1 | tee company-asset-custody-results/knowledge-intake-optimized.log
          python3 -B tests/KnowledgeCurrentAsset.Tests.py 2>&1 | tee company-asset-custody-results/knowledge-current-normal.log
          python3 -B -O tests/KnowledgeCurrentAsset.Tests.py 2>&1 | tee company-asset-custody-results/knowledge-current-optimized.log
          python3 -B scripts/verify_knowledge_assets.py | tee company-asset-custody-results/knowledge-custody.json
      - name: Verify bounded browser failure evidence controls
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~BrowserFailureEvidenceTests|FullyQualifiedName~MaterialInitialNavigationDiagnosticsTests|FullyQualifiedName~MaterialInitialRequestStagesTests"
          --logger trx --results-directory ./browser-failure-evidence-test-results
      - name: Verify all twelve sidebar culture and viewport browser cases
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~InstantQuotationSidebarLayoutBrowserTests"
          --logger trx --results-directory ./sidebar-focused-test-results
      - name: Require exact twelve passing sidebar browser rows
        run: >-
          python3 -B scripts/verify-focused-web-trx.py
          --directory ./sidebar-focused-test-results --suite sidebar
          --assembly ./Legacy.Maliev.Web.Tests/bin/Release/net10.0/Legacy.Maliev.Web.Tests.dll
      - name: Verify source material card catalogue and actual localized interactions
        timeout-minutes: 5
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~MaterialCardPresentationCatalogTests|FullyQualifiedName~MaterialPricingDisplayRendererContractTests|FullyQualifiedName~MaterialPricingDisplayBrowserTests"
          --logger trx --results-directory ./material-card-test-results
      - name: Verify regressions reject exact pre-fix pricing source and restore patched HEAD
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 tests/ComparisonCallbackRegressionGuardTests.py
          python3 scripts/verify-comparison-callback-regression.py
      - name: Preserve separate expected-failure pricing regression control
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pricing-regression-parent-control-${{ github.sha }}
          path: pricing-regression-parent-control/**
          retention-days: 7
          if-no-files-found: error
      - name: Verify accepted publisher, original nine meshes and pricing callback budgets
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~PublishWorkflowPermissionContractTests|FullyQualifiedName~NineGeneratedStlUploadsKeepDistinctReviewAndPreliminaryPreviews|FullyQualifiedName~OneMillimeterFdmUploadDoesNotInventAThinWallWarning|FullyQualifiedName~ComparisonCallback"
          --logger trx --results-directory ./publisher-mesh-test-results
      - name: Verify localized physical result, actual summary and consent browser boundaries
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~SelectedPrintTimeTimeoutDiagnosticsTests|FullyQualifiedName~InstantQuotationWallThicknessAdmittedWorkerBrowserTests|FullyQualifiedName~InstantQuotationPhysicalResultRendererTests|FullyQualifiedName~InstantQuotationTerminalPhysicalFailureBrowserTests|FullyQualifiedName~InstantQuotationSummaryTransitionBrowserTests|FullyQualifiedName~PublicCookieConsentMigrationTests|FullyQualifiedName~PublicCookieConsentBrowserTests|FullyQualifiedName~MeasurementLifecycleBrowserTests"
          --logger trx --results-directory ./physical-result-test-results
      - name: Verify Accounting numeric email state response compatibility
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~CustomerQuotationClientTests"
          --logger trx --results-directory ./quotation-response-test-results
      - name: Verify localized Knowledge sidebar and actual keyboard navigation
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~KnowledgeSidebarRouteTests|FullyQualifiedName~KnowledgeSidebarBrowserTests|FullyQualifiedName~KnowledgeGuideBundleRouteTests|FullyQualifiedName~KnowledgeCenterGuidesBrowserTests|FullyQualifiedName~KnowledgeSearchBrowserTests|FullyQualifiedName~KnowledgeReadingLayoutBrowserTests|FullyQualifiedName~KnowledgeGroupedNavigationBrowserTests|FullyQualifiedName~KnowledgeVisualAssetDeliveryTests|FullyQualifiedName~KnowledgeLibrarySourceContractTests"
          --logger trx --results-directory ./knowledge-navigation-test-results
      - name: Verify historical service gallery framing and actual mobile composition
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~ServiceGalleryHistoricalBrowserTests"
          --logger trx --results-directory ./service-gallery-test-results
      - name: Verify authenticated profile preparation and submission boundaries
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~InstantQuotationAuthenticatedProfileTests|FullyQualifiedName~InstantQuotationAuthenticatedPreparationTests|FullyQualifiedName~InstantQuotationSubmissionEndpointTests|FullyQualifiedName~InstantQuotationLocalizedValidationBrowserTests"
          --logger trx --results-directory ./authenticated-profile-test-results
      - name: Verify resolved material identity across Catalog and Order boundaries
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~NotificationClientTests|FullyQualifiedName~InstantQuotationNotificationPreparationTests|FullyQualifiedName~InstantQuotationFulfillmentCoordinatorTests|FullyQualifiedName~InstantQuotationSubmissionStoreTests|FullyQualifiedName~AdditiveQuotationNotificationComposerTests|FullyQualifiedName~AdditiveCommercialEconomicsTests|FullyQualifiedName~FdmQuantityMarginTests|FullyQualifiedName~ResinServerSupportEvidenceParityTests|FullyQualifiedName~EsdFulfillmentContractTests|FullyQualifiedName~InstantQuotationFulfillmentMappingTests|FullyQualifiedName~InstantQuotationResinPresentationTests|FullyQualifiedName~InstantQuotationReviewEditParityTests|FullyQualifiedName~InstantQuotationBuildPreferenceParityTests|FullyQualifiedName~InstantQuotationWorkflowUploadTests|FullyQualifiedName~InstantQuotationSubmissionTests"
          --logger trx --results-directory ./material-identity-test-results
      - name: Verify signed-link whole-operation deadline and compatibility
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~CncSignedLinkClientTests"
          --logger trx --results-directory ./signed-link-test-results
      - name: Verify original registry quota probe rejection controls
        run: python3 -B scripts/tests/test_startup_dockerhub_quota.py
      - name: Retain original Redis image cache or registry quota snapshot before startup
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 ./startup-image-acquisition
          python3 -B scripts/probe-startup-dockerhub-quota.py \
            --receipt ./startup-image-acquisition/dockerhub-quota.json --check-local-cache
      - name: Verify startup security migration and encrypted Redis environment isolation
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~StartupDataProtectionMigrationTests|FullyQualifiedName~RecaptchaConfigurationStartupTests|FullyQualifiedName~RecaptchaEnterpriseVerifierTests|FullyQualifiedName~AppSettingsCredentialBoundaryTests|FullyQualifiedName~ArchitectureTests|FullyQualifiedName~HealthProcessIdentityContractTests|FullyQualifiedName~CountrySourceFailureObservationTests|FullyQualifiedName~PrivateRequestObservationConsumerTests|FullyQualifiedName~LegacyServiceDefaultsIdentityContractTests|FullyQualifiedName~SharedDiagnosticsContractTests|FullyQualifiedName~ErrorIncidentCorrelationTests"
          --logger trx --results-directory ./startup-security-test-results
      - name: Verify localized ordered Home process across active and retained renderers
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~HomeStaticSsrRouteTests|FullyQualifiedName~HomeStorySsrRouteTests|FullyQualifiedName~HomeStoryBrowserTests"
          --logger trx --results-directory ./home-process-test-results
      - name: Verify localized About presentation and actual route-scoped enhancements
        timeout-minutes: 10
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~AboutPageContractTests|FullyQualifiedName~AboutStaticSsrRouteTests|FullyQualifiedName~AboutStoryBrowserTests|FullyQualifiedName~RouteScopedAssetRenderingTests|FullyQualifiedName~SharedFrontendBundleContractTests"
          --logger trx --results-directory ./about-presentation-test-results
      - name: Verify complete original Career consumer contracts
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~CareerIndexStaticSsrRouteTests|FullyQualifiedName~CareerClientTests|FullyQualifiedName~CareerDetailStaticSsrRouteTests|FullyQualifiedName~CareerSearchKestrelContractTests"
          --logger trx --results-directory ./career-consumer-test-results
      - name: Preserve successful Career focus and original oracle before the full suite
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: career-focused-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            career-original-materialization-test-results/**/*.trx
            career-consumer-test-results/**/*.trx
          retention-days: 7
          if-no-files-found: error
      - name: Verify localized account posts and rendered service SEO contracts
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~AccountForm_PostsRenderedActionAndPreservesQueryOnlyCulture|FullyQualifiedName~ResetPassword_ValidChallengeRedirectsToLoginWithoutLeakingToken|FullyQualifiedName~Login_TemporaryPasswordRedirectsToSingleUseSetupWithoutCreatingSession|FullyQualifiedName~PublicAccountWorkflowTests|FullyQualifiedName~SignupPageTests|FullyQualifiedName~LocalizedServiceSeoHttpTests|FullyQualifiedName~LocalizedCanonicalCookieHttpTests|FullyQualifiedName~PublicDocumentLinksMigrationTests|FullyQualifiedName~PublicBusinessStructuredDataMigrationTests|FullyQualifiedName~LanguageSwitchInputTests|FullyQualifiedName~SharedNavigationMigrationTests|FullyQualifiedName~SharedSelectorValidationOriginalParityTests|FullyQualifiedName~PublicDocumentVerifierQuotationHttpTests"
          --logger trx --results-directory ./localized-account-seo-test-results
      - name: Verify localized persisted inquiry boundaries through actual HTTP
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:UseLocalMalievDependencies=true
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~InquiryLocalization_|FullyQualifiedName~PublicContactFormBrowserTests.AdditionalServices_MenuWrapsAndRetainsKeyboardAndScrollAccess"
          --logger trx --results-directory ./localized-inquiry-test-results
      - name: Verify localized review and printable DFM through actual uploaded meshes
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:UseLocalMalievDependencies=true
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~ThinFdmUploadWarnsAndHeatmapDoesNotRepriceOrBlockReview|FullyQualifiedName~RepricingActivityTests|FullyQualifiedName~InstantQuotationReviewCustomerTests.RepricingStatus_IsLocalizedAndDoesNotReplacePreviousTotals"
          --logger trx --results-directory ./preliminary-dfm-test-results
      - name: Verify Thai lookup clients, same-origin boundaries and rendered interactions
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~ThaiLookup|FullyQualifiedName~OnlyWiredViewerActions_RenderEnabled"
          --logger trx --results-directory ./thai-lookup-test-results
      - name: Verify real Catalog billing selection save readback and reload
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~ThaiLookupBillingPersistenceTests"
          --logger trx --results-directory ./billing-persistence-test-results
      - name: Verify exact billing proof rows and candidate lineage
        run: python3 -B scripts/verify-billing-persistence-proof.py
      - name: Verify retained scanning comparison pointer touch and no-JavaScript browser contracts
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~ScanningComparisonBrowserTests"
          --logger trx --results-directory ./scanning-comparison-test-results
      - name: Verify original preliminary duration vectors through the public popup
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~PreliminaryQuotationDurationVectorBrowserTests"
          --logger trx --results-directory ./preliminary-duration-test-results
      - name: Prepare isolated hash-pinned preliminary PDF verification runtime
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import sys; print("PDF verifier Python", sys.version.split()[0]); sys.exit(0 if sys.version_info >= (3, 11) else "Preliminary PDF proof requires Python >=3.11")'
          proof_runner_root="$(realpath -- "$RUNNER_TEMP")"
          proof_directory="$(mktemp -d "$proof_runner_root/maliev-web-pdf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
          cleanup_failed_pdf_setup() {
            proof_setup_status="$?"
            trap - EXIT
            if [[ "$proof_setup_status" -eq 0 ]]; then return; fi
            set +e
            proof_cleanup_path="$(realpath -- "$proof_directory")"
            if [[ "$proof_cleanup_path" != "$proof_directory" || "$(dirname -- "$proof_cleanup_path")" != "$proof_runner_root" ]]; then
              echo 'Refusing early cleanup outside owned temporary root.' >&2
              exit "$proof_setup_status"
            fi
            case "$(basename -- "$proof_cleanup_path")" in
              "maliev-web-pdf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-"*) ;;
              *) echo 'Refusing early cleanup for unknown temporary prefix.' >&2; exit "$proof_setup_status" ;;
            esac
            if [[ -f "$proof_cleanup_path/.maliev-web-pdf-owned" && ! -L "$proof_cleanup_path/.maliev-web-pdf-owned" ]] &&
               [[ "$(cat -- "$proof_cleanup_path/.maliev-web-pdf-owned")" == "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" ]]; then
              rm -rf -- "$proof_cleanup_path"
            else
              # Exact mktemp ownership permits only empty-directory removal without a marker.
              rmdir -- "$proof_cleanup_path" || echo 'Early cleanup refused: directory is nonempty or ownership marker is uncertain.' >&2
            fi
            if [[ -e "$proof_cleanup_path" || -L "$proof_cleanup_path" ]]; then
              echo 'Owned PDF setup directory remains after cleanup attempt.' >&2
            fi
            exit "$proof_setup_status"
          }
          trap cleanup_failed_pdf_setup EXIT
          printf '%s:%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$proof_directory/.maliev-web-pdf-owned"
          printf 'WEB_PRELIMINARY_PDF_VENV=%s\n' "$proof_directory" >> "$GITHUB_ENV"
          python3 -m venv "$proof_directory"
          "$proof_directory/bin/python" -m pip install \
            --disable-pip-version-check --no-input --require-hashes \
            --only-binary=:all: --no-deps --timeout 30 --retries 1 \
            --requirement tests/preliminary-pdf-requirements.txt
      - name: Verify preliminary PDF parser rejection controls
        timeout-minutes: 1
        shell: bash
        run: '"$WEB_PRELIMINARY_PDF_VENV/bin/python" tests/PreliminaryPdfProofGuardTests.py'
      - name: Verify actual two and ten part preliminary popup PDF exports
        timeout-minutes: 15
        env:
          WEB_PRELIMINARY_PDF_EVIDENCE_DIRECTORY: ${{ github.workspace }}/preliminary-pdf-test-results/pdf
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:UseLocalMalievDependencies=true
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~ActualUploadedParts_PreliminaryPopupExportsA4Pdf"
          --logger trx --results-directory ./preliminary-pdf-test-results
      - name: Verify focused preliminary PDF structure and exact-byte manifests
        timeout-minutes: 1
        shell: bash
        run: >-
          "$WEB_PRELIMINARY_PDF_VENV/bin/python" scripts/verify-preliminary-pdf-proof.py
          --root ./preliminary-pdf-test-results/pdf
          --receipt ./preliminary-pdf-test-results/parser-receipt.json
      - name: Validate .NET solution
        uses: MALIEV-Co-Ltd/Legacy.Maliev.Workflows/actions/dotnet-validate@e5732037fe94b7ed6e5be2cd4c23dbf6ef5e2617
        with:
          solution: Legacy.Maliev.Web.slnx
          use-local-maliev-dependencies: 'true'
      - name: Gate raw generated-inclusive Web coverage
        if: always()
        shell: pwsh
        run: |
          ./tests/WebFxRawCoverage.Tests.ps1
          ./tests/Test-WebFxRawCoverage.ps1 -ResultsRoot ./Legacy.Maliev.Web.Tests/TestResults
      - name: Verify full-suite preliminary PDF structure and exact-byte manifests
        timeout-minutes: 1
        shell: bash
        run: >-
          "$WEB_PRELIMINARY_PDF_VENV/bin/python" scripts/verify-preliminary-pdf-proof.py
          --root ./Legacy.Maliev.Web.Tests/bin/Release/net10.0/TestResults/preliminary-pdf-proof
          --receipt ./preliminary-pdf-full-proof/parser-receipt.json
      - name: Remove only the owned preliminary PDF verification runtime
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${WEB_PRELIMINARY_PDF_VENV:-}" ]]; then exit 0; fi
          if [[ ! -e "$WEB_PRELIMINARY_PDF_VENV" && ! -L "$WEB_PRELIMINARY_PDF_VENV" ]]; then exit 0; fi
          proof_runner_root="$(realpath -- "$RUNNER_TEMP")"
          proof_directory="$(realpath -- "$WEB_PRELIMINARY_PDF_VENV")"
          [[ "$proof_directory" == "$WEB_PRELIMINARY_PDF_VENV" ]]
          [[ "$(dirname -- "$proof_directory")" == "$proof_runner_root" ]]
          case "$(basename -- "$proof_directory")" in
            "maliev-web-pdf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-"*) ;;
            *) echo 'Refusing cleanup outside the owned preliminary PDF runtime.' >&2; exit 1 ;;
          esac
          [[ -f "$proof_directory/.maliev-web-pdf-owned" && ! -L "$proof_directory/.maliev-web-pdf-owned" ]]
          [[ "$(cat -- "$proof_directory/.maliev-web-pdf-owned")" == "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" ]]
          rm -rf -- "$proof_directory"
          [[ ! -e "$proof_directory" && ! -L "$proof_directory" ]]
      - name: Preserve independent focused groups and full raw coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: web-combined-native-${{ github.sha }}
          path: |
            Legacy.Maliev.Web/wwwroot/dist/site.min.css
