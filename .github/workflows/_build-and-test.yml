name: Build and test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  focused:
    name: focused
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
      MSBUILDDISABLENODEREUSE: '1'
      UseSharedCompilation: 'false'
      MalievWorkspaceRoot: ${{ github.workspace }}/.dependencies
      MALIEV_WEB_STARTUP_PROOF: hosted-owned
      MALIEV_BILLING_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      MALIEV_BROWSER_EVIDENCE_DIR: ${{ github.workspace }}/sidebar-navigation-test-results
    steps:
      - name: Check out Web
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check out Legacy.Maliev.ServiceDefaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: 4ffba0639620e7e923d331317f3f28501526b573
          path: .dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Check out Legacy.Maliev.CompatibilityContracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
          path: .dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Verify offline Search Console cohort reporter
        shell: pwsh
        run: ./tests/SearchConsoleCohortReport.Tests.ps1
      - name: Set up original Career oracle runtime
        timeout-minutes: 5
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 8.0.x
      - name: Build original Career materialization oracle
        timeout-minutes: 5
        run: >-
          dotnet build acceptance/CareerOriginalMaterialization/CareerOriginalMaterialization.Tests.csproj
          --configuration Release --disable-build-servers -warnaserror
          -p:UseSharedCompilation=false -nodeReuse:false
      - name: Verify original Career materialization oracle
        timeout-minutes: 5
        run: >-
          dotnet test acceptance/CareerOriginalMaterialization/CareerOriginalMaterialization.Tests.csproj
          --configuration Release --no-build --no-restore --disable-build-servers
          -p:UseSharedCompilation=false -nodeReuse:false
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --logger trx --results-directory ./career-original-materialization-test-results
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Legacy.Maliev.Web/package-lock.json
      - name: Build deterministic browser assets
        working-directory: Legacy.Maliev.Web
        run: npm run ci
      - name: Verify committed browser assets
        run: git diff --exit-code -- Legacy.Maliev.Web/wwwroot/dist
      - name: Verify frozen source-parity manifest
        shell: pwsh
        run: ./scripts/verify-complete-source-history-parity.ps1 -ManifestOnly
      - name: Build exact-pinned disposable profile boundary services
        shell: pwsh
        run: ./scripts/prepare-profile-producer-boundary.ps1
      - name: Build exact-pinned disposable member authentication proof
        shell: pwsh
        run: ./scripts/prepare-member-auth-indexing-proof.ps1
      - name: Build exact-pinned Catalog for member billing persistence proof
        shell: pwsh
        run: ./scripts/prepare-billing-catalog-proof.ps1
      - name: Build exact-pinned disposable SCB payment boundary service
        shell: pwsh
        run: ./scripts/prepare-scb-payment-boundary.ps1
      - name: Build browser acceptance host
        run: GITHUB_ACTIONS=false dotnet build Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj --configuration Release
      - name: Verify independent WebSurface and account-boundary ownership regressions
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~PublishWorkflowPermissionContractTests|FullyQualifiedName~Legacy.Maliev.Web.Tests.WebSurfaceOwnedLifetimeTests|FullyQualifiedName~Legacy.Maliev.Web.Tests.AccountBoundaryOwnedLifetimeTests"
          --logger trx --results-directory ./websurface-owned-lifetime-test-results
      - name: Verify exact owned-resource refusal and cleanup controls
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~CncOwnedResourceScopeTests|FullyQualifiedName~MaterialPricingAsyncCleanupTests"
          --logger trx --results-directory ./cnc-resource-test-results
      - name: Verify literal CNC profile writes through the exact composed producer
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~CncLiteralProducerBoundaryTests"
          --logger trx --results-directory ./cnc-literal-producer-test-results
      - name: Verify material pricing progress boundaries
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~InstantQuotationMaterialPricingProgressTests|FullyQualifiedName~MaterialCompletionObservationForwardingTests"
          --logger trx --results-directory ./material-progress-test-results
      - name: Verify protected ticket currency identity
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~ProtectedTicket_NonCanonicalCurrencyOrRate_IsRejected|FullyQualifiedName~IssuedTickets_CanonicalThbIdentityAndEngineerReview_RemainValid"
          --logger trx --results-directory ./ticket-test-results
      - name: Install pinned Chromium browser
        shell: bash
        timeout-minutes: 8
        run: |
          # Use the signed official HTTPS archive after the hosted Azure mirror stalled.
          test -s /etc/apt/apt-mirrors.txt
          python3 -c 'from pathlib import Path; s=Path("/etc/apt/sources.list.d/ubuntu.sources").read_text(); assert "mirror+file:/etc/apt/apt-mirrors.txt" in s and "Signed-By:" in s, "Unexpected hosted Ubuntu source policy"'
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          pwsh -NoProfile -File ./Legacy.Maliev.Web.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Verify focused TRX rejection controls
        run: python3 -B tests/FocusedWebTrxGate.Tests.py
      - name: Verify LINE source regression guard controls
        timeout-minutes: 2
        run: |
          python3 -B tests/LineContactRegressionGuard.Tests.py
          python3 -B -O tests/LineContactRegressionGuard.Tests.py
      - name: Verify exact LINE source baseline and restored candidate
        timeout-minutes: 55
        env:
          GH_TOKEN: ${{ github.token }}
          LINE_CONTACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B scripts/verify-line-contact-regression.py
      - name: Preserve separate LINE expected-failure source proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: line-contact-regression-${{ github.sha }}
          path: |
            line-contact-regression-proof/**
            tests/fixtures/line-contact-regression-contract.json
          retention-days: 7
          if-no-files-found: error
      - name: Verify bounded browser failure evidence controls
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~BrowserFailureEvidenceTests"
          --logger trx --results-directory ./browser-failure-evidence-test-results
      - name: Verify all ten sidebar culture and viewport browser cases
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~InstantQuotationSidebarLayoutBrowserTests"
          --logger trx --results-directory ./sidebar-focused-test-results
      - name: Require exact ten passing sidebar browser rows
        run: >-
          python3 -B scripts/verify-focused-web-trx.py
          --directory ./sidebar-focused-test-results --suite sidebar
          --assembly ./Legacy.Maliev.Web.Tests/bin/Release/net10.0/Legacy.Maliev.Web.Tests.dll
      - name: Verify source material card catalogue and actual localized interactions
        timeout-minutes: 5
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~MaterialCardPresentationCatalogTests|FullyQualifiedName~MaterialPricingDisplayRendererContractTests|FullyQualifiedName~MaterialPricingDisplayBrowserTests"
          --logger trx --results-directory ./material-card-test-results
      - name: Verify regressions reject exact pre-fix pricing source and restore patched HEAD
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 tests/ComparisonCallbackRegressionGuardTests.py
          python3 scripts/verify-comparison-callback-regression.py
      - name: Preserve separate expected-failure pricing regression control
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pricing-regression-parent-control-${{ github.sha }}
          path: pricing-regression-parent-control/**
          retention-days: 7
          if-no-files-found: error
      - name: Verify accepted publisher, original nine meshes and pricing callback budgets
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~PublishWorkflowPermissionContractTests|FullyQualifiedName~NineGeneratedStlUploadsKeepDistinctReviewAndPreliminaryPreviews|FullyQualifiedName~OneMillimeterFdmUploadDoesNotInventAThinWallWarning|FullyQualifiedName~ComparisonCallback"
          --logger trx --results-directory ./publisher-mesh-test-results
      - name: Verify localized physical result, actual summary and consent browser boundaries
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~SelectedPrintTimeTimeoutDiagnosticsTests|FullyQualifiedName~InstantQuotationWallThicknessAdmittedWorkerBrowserTests|FullyQualifiedName~InstantQuotationPhysicalResultRendererTests|FullyQualifiedName~InstantQuotationTerminalPhysicalFailureBrowserTests|FullyQualifiedName~InstantQuotationSummaryTransitionBrowserTests|FullyQualifiedName~PublicCookieConsentMigrationTests|FullyQualifiedName~PublicCookieConsentBrowserTests|FullyQualifiedName~MeasurementLifecycleBrowserTests"
          --logger trx --results-directory ./physical-result-test-results
      - name: Verify Accounting numeric email state response compatibility
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~CustomerQuotationClientTests"
          --logger trx --results-directory ./quotation-response-test-results
      - name: Verify localized Knowledge sidebar and actual keyboard navigation
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~KnowledgeSidebarRouteTests|FullyQualifiedName~KnowledgeSidebarBrowserTests"
          --logger trx --results-directory ./knowledge-navigation-test-results
      - name: Verify localized ordered Home process across active and retained renderers
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~HomeStaticSsrRouteTests"
          --logger trx --results-directory ./home-process-test-results
      - name: Verify historical service gallery framing and actual mobile composition
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~ServiceGalleryHistoricalBrowserTests"
          --logger trx --results-directory ./service-gallery-test-results
      - name: Verify authenticated profile preparation and submission boundaries
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~InstantQuotationAuthenticatedProfileTests|FullyQualifiedName~InstantQuotationAuthenticatedPreparationTests|FullyQualifiedName~InstantQuotationSubmissionEndpointTests"
          --logger trx --results-directory ./authenticated-profile-test-results
      - name: Verify resolved material identity across Catalog and Order boundaries
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~NotificationClientTests|FullyQualifiedName~InstantQuotationNotificationPreparationTests|FullyQualifiedName~InstantQuotationFulfillmentCoordinatorTests|FullyQualifiedName~InstantQuotationSubmissionStoreTests|FullyQualifiedName~AdditiveQuotationNotificationComposerTests|FullyQualifiedName~AdditiveCommercialEconomicsTests|FullyQualifiedName~FdmQuantityMarginTests|FullyQualifiedName~ResinServerSupportEvidenceParityTests|FullyQualifiedName~EsdFulfillmentContractTests|FullyQualifiedName~InstantQuotationFulfillmentMappingTests|FullyQualifiedName~InstantQuotationResinPresentationTests|FullyQualifiedName~InstantQuotationReviewEditParityTests|FullyQualifiedName~InstantQuotationBuildPreferenceParityTests|FullyQualifiedName~InstantQuotationWorkflowUploadTests|FullyQualifiedName~InstantQuotationSubmissionTests"
          --logger trx --results-directory ./material-identity-test-results
      - name: Verify signed-link whole-operation deadline and compatibility
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~CncSignedLinkClientTests"
          --logger trx --results-directory ./signed-link-test-results
      - name: Verify original registry quota probe rejection controls
        run: python3 -B scripts/tests/test_startup_dockerhub_quota.py
      - name: Retain original Redis image cache or registry quota snapshot before startup
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 ./startup-image-acquisition
          python3 -B scripts/probe-startup-dockerhub-quota.py \
            --receipt ./startup-image-acquisition/dockerhub-quota.json --check-local-cache
      - name: Verify startup security migration and encrypted Redis environment isolation
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~StartupDataProtectionMigrationTests|FullyQualifiedName~RecaptchaConfigurationStartupTests|FullyQualifiedName~RecaptchaEnterpriseVerifierTests|FullyQualifiedName~AppSettingsCredentialBoundaryTests|FullyQualifiedName~ArchitectureTests|FullyQualifiedName~HealthProcessIdentityContractTests|FullyQualifiedName~CountrySourceFailureObservationTests|FullyQualifiedName~PrivateRequestObservationConsumerTests|FullyQualifiedName~LegacyServiceDefaultsIdentityContractTests|FullyQualifiedName~SharedDiagnosticsContractTests|FullyQualifiedName~ErrorIncidentCorrelationTests|FullyQualifiedName~WebPrivateLoggingSourceTests"
          --logger trx --results-directory ./startup-security-test-results
      - name: Verify complete original Career consumer contracts
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~CareerIndexStaticSsrRouteTests|FullyQualifiedName~CareerClientTests|FullyQualifiedName~CareerDetailStaticSsrRouteTests|FullyQualifiedName~CareerSearchKestrelContractTests"
          --logger trx --results-directory ./career-consumer-test-results
      - name: Preserve successful Career focus and original oracle before the full suite
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: career-focused-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            career-original-materialization-test-results/**/*.trx
            career-consumer-test-results/**/*.trx
          retention-days: 7
          if-no-files-found: error
      - name: Verify localized account posts and rendered service SEO contracts
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~AccountChallengeRoutes_RejectMissingChallengeData|FullyQualifiedName~EmailConfirmationStaticSsrRouteTests|FullyQualifiedName~AccountForm_PostsRenderedActionAndPreservesQueryOnlyCulture|FullyQualifiedName~ResetPassword_ValidChallengeRedirectsToLoginWithoutLeakingToken|FullyQualifiedName~Login_TemporaryPasswordRedirectsToSingleUseSetupWithoutCreatingSession|FullyQualifiedName~PublicAccountWorkflowTests|FullyQualifiedName~SignupPageTests|FullyQualifiedName~LocalizedServiceSeoHttpTests|FullyQualifiedName~LocalizedCanonicalCookieHttpTests|FullyQualifiedName~PublicDocumentLinksMigrationTests|FullyQualifiedName~PublicBusinessStructuredDataMigrationTests|FullyQualifiedName~LanguageSwitchInputTests|FullyQualifiedName~SharedNavigationMigrationTests|FullyQualifiedName~SharedSelectorValidationOriginalParityTests|FullyQualifiedName~PublicDocumentVerifierQuotationHttpTests"
          --logger trx --results-directory ./localized-account-seo-test-results
      - name: Verify localized persisted inquiry boundaries through actual HTTP
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:UseLocalMalievDependencies=true
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~InquiryLocalization_"
          --logger trx --results-directory ./localized-inquiry-test-results
      - name: Verify localized review and printable DFM through actual uploaded meshes
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:UseLocalMalievDependencies=true
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~ThinFdmUploadWarnsAndHeatmapDoesNotRepriceOrBlockReview|FullyQualifiedName~RepricingActivityTests|FullyQualifiedName~InstantQuotationReviewCustomerTests.RepricingStatus_IsLocalizedAndDoesNotReplacePreviousTotals"
          --logger trx --results-directory ./preliminary-dfm-test-results
      - name: Verify Thai lookup clients, same-origin boundaries and rendered interactions
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~ThaiLookup|FullyQualifiedName~OnlyWiredViewerActions_RenderEnabled"
          --logger trx --results-directory ./thai-lookup-test-results
      - name: Verify real Catalog billing selection save readback and reload
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~ThaiLookupBillingPersistenceTests"
          --logger trx --results-directory ./billing-persistence-test-results
      - name: Verify exact billing proof rows and candidate lineage
        run: python3 -B scripts/verify-billing-persistence-proof.py
      - name: Verify retained scanning comparison pointer touch and no-JavaScript browser contracts
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~ScanningComparisonBrowserTests"
          --logger trx --results-directory ./scanning-comparison-test-results
      - name: Verify original preliminary duration vectors through the public popup
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~PreliminaryQuotationDurationVectorBrowserTests"
          --logger trx --results-directory ./preliminary-duration-test-results
      - name: Prepare isolated hash-pinned preliminary PDF verification runtime
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import sys; print("PDF verifier Python", sys.version.split()[0]); sys.exit(0 if sys.version_info >= (3, 11) else "Preliminary PDF proof requires Python >=3.11")'
          proof_runner_root="$(realpath -- "$RUNNER_TEMP")"
          proof_directory="$(mktemp -d "$proof_runner_root/maliev-web-pdf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
          cleanup_failed_pdf_setup() {
            proof_setup_status="$?"
            trap - EXIT
            if [[ "$proof_setup_status" -eq 0 ]]; then return; fi
            set +e
            proof_cleanup_path="$(realpath -- "$proof_directory")"
            if [[ "$proof_cleanup_path" != "$proof_directory" || "$(dirname -- "$proof_cleanup_path")" != "$proof_runner_root" ]]; then
              echo 'Refusing early cleanup outside owned temporary root.' >&2
              exit "$proof_setup_status"
            fi
            case "$(basename -- "$proof_cleanup_path")" in
              "maliev-web-pdf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-"*) ;;
              *) echo 'Refusing early cleanup for unknown temporary prefix.' >&2; exit "$proof_setup_status" ;;
            esac
            if [[ -f "$proof_cleanup_path/.maliev-web-pdf-owned" && ! -L "$proof_cleanup_path/.maliev-web-pdf-owned" ]] &&
               [[ "$(cat -- "$proof_cleanup_path/.maliev-web-pdf-owned")" == "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" ]]; then
              rm -rf -- "$proof_cleanup_path"
            else
              # Exact mktemp ownership permits only empty-directory removal without a marker.
              rmdir -- "$proof_cleanup_path" || echo 'Early cleanup refused: directory is nonempty or ownership marker is uncertain.' >&2
            fi
            if [[ -e "$proof_cleanup_path" || -L "$proof_cleanup_path" ]]; then
              echo 'Owned PDF setup directory remains after cleanup attempt.' >&2
            fi
            exit "$proof_setup_status"
          }
          trap cleanup_failed_pdf_setup EXIT
          printf '%s:%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$proof_directory/.maliev-web-pdf-owned"
          printf 'WEB_PRELIMINARY_PDF_VENV=%s\n' "$proof_directory" >> "$GITHUB_ENV"
          python3 -m venv "$proof_directory"
          "$proof_directory/bin/python" -m pip install \
            --disable-pip-version-check --no-input --require-hashes \
            --only-binary=:all: --no-deps --timeout 30 --retries 1 \
            --requirement tests/preliminary-pdf-requirements.txt
      - name: Verify preliminary PDF parser rejection controls
        timeout-minutes: 1
        shell: bash
        run: '"$WEB_PRELIMINARY_PDF_VENV/bin/python" tests/PreliminaryPdfProofGuardTests.py'
      - name: Verify actual two and ten part preliminary popup PDF exports
        timeout-minutes: 15
        env:
          WEB_PRELIMINARY_PDF_EVIDENCE_DIRECTORY: ${{ github.workspace }}/preliminary-pdf-test-results/pdf
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:UseLocalMalievDependencies=true
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~ActualUploadedParts_PreliminaryPopupExportsA4Pdf"
          --logger trx --results-directory ./preliminary-pdf-test-results
      - name: Verify focused preliminary PDF structure and exact-byte manifests
        timeout-minutes: 1
        shell: bash
        run: >-
          "$WEB_PRELIMINARY_PDF_VENV/bin/python" scripts/verify-preliminary-pdf-proof.py
          --root ./preliminary-pdf-test-results/pdf
          --receipt ./preliminary-pdf-test-results/parser-receipt.json
      - name: Stage bounded focused TRX checkpoint before full validation
        id: focused_checkpoint_capture
        if: always()
        shell: bash
        env:
          FOCUSED_EVENT_SHA: ${{ github.sha }}
          FOCUSED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FOCUSED_RUN_ID: ${{ github.run_id }}
          FOCUSED_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, stat, subprocess, time
          from pathlib import Path
          DIRECTORIES = ('ticket-test-results', 'websurface-owned-lifetime-test-results', 'line-contact-candidate-test-results', 'cnc-resource-test-results', 'cnc-literal-producer-test-results', 'sidebar-focused-test-results', 'publisher-mesh-test-results', 'physical-result-test-results', 'quotation-response-test-results', 'knowledge-navigation-test-results', 'home-process-test-results', 'service-gallery-test-results', 'authenticated-profile-test-results', 'material-identity-test-results', 'material-progress-test-results', 'material-card-test-results', 'signed-link-test-results', 'startup-security-test-results', 'scanning-comparison-test-results', 'preliminary-duration-test-results', 'localized-account-seo-test-results', 'localized-inquiry-test-results', 'preliminary-dfm-test-results', 'preliminary-pdf-test-results', 'thai-lookup-test-results', 'billing-persistence-test-results')
          PARSER_RECEIPT = 'preliminary-pdf-test-results/parser-receipt.json'
          MAX_FILES, MAX_FILE_BYTES, MAX_TOTAL_BYTES = (2000, 32 * 1024 * 1024, 128 * 1024 * 1024)

          def checkpoint(root, identity, checked_head, checked_tree):
              started = time.monotonic()
              root = root.resolve(strict=True)
              if not set(identity) == {'event_sha', 'candidate_sha', 'run_id', 'attempt'}:
                  raise RuntimeError('Focused evidence checkpoint contract rejected')
              if not all((re.fullmatch('[0-9a-f]{40}', value) for value in [identity['event_sha'], identity['candidate_sha'], checked_head, checked_tree])):
                  raise RuntimeError('Focused evidence checkpoint contract rejected')
              if not all((re.fullmatch('[1-9][0-9]{0,19}', identity[key]) for key in ['run_id', 'attempt'])):
                  raise RuntimeError('Focused evidence checkpoint contract rejected')
              destination = root / ('focused-checkpoint-' + identity['run_id'] + '-' + identity['attempt'])
              destination.mkdir(exist_ok=False)
              records, total, entries = ([], 0, 0)

              def regular(path, directory=False):
                  info = path.lstat()
                  if not (not stat.S_ISLNK(info.st_mode) and (not getattr(info, 'st_file_attributes', 0) & 1024)):
                      raise RuntimeError('Focused evidence checkpoint contract rejected')
                  if not (stat.S_ISDIR(info.st_mode) if directory else stat.S_ISREG(info.st_mode)):
                      raise RuntimeError('Focused evidence checkpoint contract rejected')
                  if not path.resolve(strict=True).is_relative_to(root):
                      raise RuntimeError('Focused evidence checkpoint contract rejected')
                  return info

              def copy(path):
                  nonlocal total
                  if not (time.monotonic() - started < 60 and len(records) < MAX_FILES):
                      raise RuntimeError('Focused evidence checkpoint contract rejected')
                  info = regular(path)
                  if not (info.st_size <= MAX_FILE_BYTES and total + info.st_size <= MAX_TOTAL_BYTES):
                      raise RuntimeError('Focused evidence checkpoint contract rejected')
                  relative = path.relative_to(root)
                  target = destination / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  digest, length = (hashlib.sha256(), 0)
                  descriptor = os.open(path, os.O_RDONLY | getattr(os, 'O_NOFOLLOW', 0))
                  with os.fdopen(descriptor, 'rb') as source, target.open('xb') as output:
                      opened = os.fstat(source.fileno())
                      if not (opened.st_dev, opened.st_ino, opened.st_size, opened.st_mtime_ns) == (info.st_dev, info.st_ino, info.st_size, info.st_mtime_ns):
                          raise RuntimeError('Focused evidence checkpoint contract rejected')
                      while (chunk := source.read(1024 * 1024)):
                          length += len(chunk)
                          if not (length <= info.st_size and time.monotonic() - started < 60):
                              raise RuntimeError('Focused evidence checkpoint contract rejected')
                          digest.update(chunk)
                          output.write(chunk)
                      after = os.fstat(source.fileno())
                      if not (after.st_size, after.st_mtime_ns) == (info.st_size, info.st_mtime_ns):
                          raise RuntimeError('Focused evidence checkpoint contract rejected')
                  final = regular(path)
                  if not (final.st_dev, final.st_ino, final.st_size, final.st_mtime_ns) == (info.st_dev, info.st_ino, info.st_size, info.st_mtime_ns):
                      raise RuntimeError('Focused evidence checkpoint contract rejected')
                  if not length == info.st_size:
                      raise RuntimeError('Focused evidence checkpoint contract rejected')
                  total += length
                  records.append({'path': relative.as_posix(), 'bytes': length, 'sha256': digest.hexdigest()})
              for name in DIRECTORIES:
                  directory = root / name
                  if not directory.exists() and (not directory.is_symlink()):
                      continue
                  regular(directory, directory=True)
                  visited = 0
                  for current, directories, filenames in os.walk(directory, followlinks=False):
                      visited += 1
                      entries += 1 + len(directories) + len(filenames)
                      if not entries <= MAX_FILES:
                          raise RuntimeError('Focused evidence checkpoint contract rejected')
                      if not (visited <= MAX_FILES and time.monotonic() - started < 60):
                          raise RuntimeError('Focused evidence checkpoint contract rejected')
                      for child in directories:
                          regular(Path(current) / child, directory=True)
                      for name in sorted(filenames):
                          if name.endswith('.trx'):
                              copy(Path(current) / name)
              parser = root / PARSER_RECEIPT
              if parser.exists() or parser.is_symlink():
                  regular(parser.parent, directory=True)
                  copy(parser)
              if not any((record['path'].endswith('.trx') for record in records)):
                  raise RuntimeError('No focused TRX retained')
              receipt = {'schema': 'web-focused-checkpoint.v1', **identity, 'checked_head': checked_head, 'checked_tree': checked_tree, 'files': records, 'total_bytes': total, 'scope': 'pre-full focused evidence only; no full-suite or runner-cause acceptance'}
              with (destination / 'checkpoint-receipt.json').open('x', encoding='utf-8') as output:
                  json.dump(receipt, output, sort_keys=True, indent=2)
              return destination
          if __name__ == '__main__':
              identity = {key: os.environ['FOCUSED_' + key.upper()] for key in ['event_sha', 'candidate_sha', 'run_id', 'attempt']}

              def git_value(argument):
                  return subprocess.check_output(['git', 'rev-parse', argument], timeout=10, text=True).strip()
              checkpoint(Path.cwd(), identity, git_value('HEAD'), git_value('HEAD^{tree}'))
          PY
      - name: Preserve focused TRX checkpoint before full validation
        if: always() && steps.focused_checkpoint_capture.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: web-focused-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: focused-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 7
          if-no-files-found: error
      - name: Remove only the owned preliminary PDF verification runtime
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${WEB_PRELIMINARY_PDF_VENV:-}" ]]; then exit 0; fi
          if [[ ! -e "$WEB_PRELIMINARY_PDF_VENV" && ! -L "$WEB_PRELIMINARY_PDF_VENV" ]]; then exit 0; fi
          proof_runner_root="$(realpath -- "$RUNNER_TEMP")"
          proof_directory="$(realpath -- "$WEB_PRELIMINARY_PDF_VENV")"
          [[ "$proof_directory" == "$WEB_PRELIMINARY_PDF_VENV" ]]
          [[ "$(dirname -- "$proof_directory")" == "$proof_runner_root" ]]
          case "$(basename -- "$proof_directory")" in
            "maliev-web-pdf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-"*) ;;
            *) echo 'Refusing cleanup outside the owned preliminary PDF runtime.' >&2; exit 1 ;;
          esac
          [[ -f "$proof_directory/.maliev-web-pdf-owned" && ! -L "$proof_directory/.maliev-web-pdf-owned" ]]
          [[ "$(cat -- "$proof_directory/.maliev-web-pdf-owned")" == "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" ]]
          rm -rf -- "$proof_directory"
          [[ ! -e "$proof_directory" && ! -L "$proof_directory" ]]
      - name: Preserve independent focused groups and full raw coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: web-focused-native-${{ github.sha }}
          path: |
            Legacy.Maliev.Web.Tests/TestResults/**/*.trx
            Legacy.Maliev.Web.Tests/TestResults/**/coverage.json
            Legacy.Maliev.Web.Tests/TestResults/**/coverage.cobertura.xml
            ticket-test-results/**/*.trx
            career-original-materialization-test-results/**/*.trx
            career-consumer-test-results/**/*.trx
            websurface-owned-lifetime-test-results/**/*.trx
            line-contact-candidate-test-results/**/*.trx
            cnc-resource-test-results/**/*.trx
            cnc-literal-producer-test-results/**/*.trx
            sidebar-navigation-test-results/sidebar-*-initial-navigation-timeout.json
            sidebar-focused-test-results/**/*.trx
            publisher-mesh-test-results/**/*.trx
            physical-result-test-results/**/*.trx
            quotation-response-test-results/**/*.trx
            knowledge-navigation-test-results/**/*.trx
            home-process-test-results/**/*.trx
            service-gallery-test-results/**/*.trx
            authenticated-profile-test-results/**/*.trx
            material-identity-test-results/**/*.trx
            material-progress-test-results/**/*.trx
            material-card-test-results/**/*.trx
            Legacy.Maliev.Web.Tests/bin/Release/net10.0/TestResults/material-display-browser-controls/*.png
            Legacy.Maliev.Web.Tests/bin/Release/net10.0/TestResults/material-display-browser-controls/*.json
            Legacy.Maliev.Web.Tests/bin/Release/net10.0/TestResults/material-display-browser-diagnostics/*.json
            signed-link-test-results/**/*.trx
            startup-security-test-results/**/*.trx
            startup-image-acquisition/dockerhub-quota.json
            scanning-comparison-test-results/**/*.trx
            preliminary-duration-test-results/**/*.trx
            Legacy.Maliev.Web.Tests/bin/Release/net10.0/scanning-comparison-screenshots/*.png
            localized-account-seo-test-results/**/*.trx
            localized-inquiry-test-results/**/*.trx
            preliminary-dfm-test-results/**/*.trx
            preliminary-pdf-test-results/**/*.trx
            preliminary-pdf-test-results/pdf/*.pdf
            preliminary-pdf-test-results/pdf/*.json
            preliminary-pdf-test-results/parser-receipt.json
            Legacy.Maliev.Web.Tests/bin/Release/net10.0/TestResults/preliminary-pdf-proof/*.pdf
            Legacy.Maliev.Web.Tests/bin/Release/net10.0/TestResults/preliminary-pdf-proof/*.json
            preliminary-pdf-full-proof/parser-receipt.json
            thai-lookup-test-results/**/*.trx
            billing-persistence-test-results/**/*.trx
            Legacy.Maliev.Web.Tests/bin/Release/net10.0/TestResults/billing-persistence/*.png
            Legacy.Maliev.Web.Tests/bin/Release/net10.0/TestResults/billing-persistence/*.json
            Legacy.Maliev.Web.Tests/bin/Release/net10.0/TestResults/billing-persistence/initial-readiness/*.json
            Legacy.Maliev.Web.Tests/bin/Release/net10.0/TestResults/billing-persistence/attempts/*.json
            Legacy.Maliev.Web.Tests/bin/Release/net10.0/TestResults/billing-persistence/attempts/*.png
            Legacy.Maliev.Web.Tests/TestResults/thai-lookup-browser/*.png
            Legacy.Maliev.Web.Tests/TestResults/knowledge-navigation-browser/*.png
            Legacy.Maliev.Web.Tests/TestResults/knowledge-navigation-browser/*.json
            tests/web-fx-generated-inclusive.runsettings
          retention-days: 7
          if-no-files-found: error

  resource_checkpoint_qualification:
    name: resource checkpoint qualification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MALIEV_BILLING_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out Web
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify hosted resource checkpoint controls
        shell: bash
        run: python3 -B tests/HostedValidationResourceCheckpointTests.py
      - name: Qualify completed background checkpoint and artifact context
        id: completed_checkpoint
        background: true
        uses: ./.github/actions/validation-resource-checkpoints
        with:
          mode: qualification-complete
      - name: Join the completed qualification
        wait: completed_checkpoint
      - name: Verify persisted baseline artifact identity
        shell: bash
        env:
          BASELINE_ARTIFACT_ID: ${{ steps.completed_checkpoint.outputs.baseline-artifact-id }}
        run: |
          python3 - <<'PY'
          import os
          value = os.environ['BASELINE_ARTIFACT_ID']
          assert value.isascii() and value.isdecimal() and 0 < int(value), 'Hosted background artifact context was not qualified'
          PY
      - name: Qualify cancelling a completed checkpoint
        cancel: completed_checkpoint
      - name: Qualify live background ownership
        id: live_checkpoint
        background: true
        uses: ./.github/actions/validation-resource-checkpoints
        with:
          mode: qualification-live
      - name: Observe the exact live qualification worker
        shell: bash
        env:
          RESOURCE_CHECKPOINT_SCOPE: qualification-live
        run: >-
          exec python3 -B scripts/hosted-validation-resource-checkpoint.py wait
          --directory "$RUNNER_TEMP/web-validation-resources-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$RESOURCE_CHECKPOINT_SCOPE"
          --phase 1
      - name: Stop the exact live qualification step
        cancel: live_checkpoint
      - name: Require cancelled outer live context and successful completed baseline
        shell: bash
        env:
          LIVE_OUTCOME: ${{ steps.live_checkpoint.outcome }}
          LIVE_CONCLUSION: ${{ steps.live_checkpoint.conclusion }}
          COMPLETED_OUTCOME: ${{ steps.completed_checkpoint.outcome }}
        run: |
          python3 - <<'PY'
          import os
          if (os.environ['LIVE_OUTCOME'], os.environ['LIVE_CONCLUSION'], os.environ['COMPLETED_OUTCOME']) != ('cancelled', 'cancelled', 'success'):
              raise RuntimeError('Hosted outer cancellation state was not qualified')
          PY
      - name: Require exact-owner cleanup of the completed qualification worker
        shell: bash
        env:
          RESOURCE_CHECKPOINT_SCOPE: qualification-complete
        run: >-
          exec python3 -B scripts/hosted-validation-resource-checkpoint.py cleanup
          --directory "$RUNNER_TEMP/web-validation-resources-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$RESOURCE_CHECKPOINT_SCOPE"
      - name: Require exact-owner cleanup of the live qualification worker
        shell: bash
        env:
          RESOURCE_CHECKPOINT_SCOPE: qualification-live
        run: >-
          exec python3 -B scripts/hosted-validation-resource-checkpoint.py cleanup
          --directory "$RUNNER_TEMP/web-validation-resources-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$RESOURCE_CHECKPOINT_SCOPE"
      - name: Independently verify the completed qualification worker released
        shell: bash
        env:
          RESOURCE_CHECKPOINT_SCOPE: qualification-complete
        run: >-
          exec python3 -B scripts/hosted-validation-resource-checkpoint.py released
          --directory "$RUNNER_TEMP/web-validation-resources-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$RESOURCE_CHECKPOINT_SCOPE"
      - name: Independently verify the live qualification worker released
        shell: bash
        env:
          RESOURCE_CHECKPOINT_SCOPE: qualification-live
        run: >-
          exec python3 -B scripts/hosted-validation-resource-checkpoint.py released
          --directory "$RUNNER_TEMP/web-validation-resources-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$RESOURCE_CHECKPOINT_SCOPE"
      - name: Require final completed composite quiescence and final-ledger release
        shell: bash
        env:
          RESOURCE_CHECKPOINT_SCOPE: qualification-complete
        run: >-
          exec python3 -B scripts/hosted-validation-resource-checkpoint.py quiescence
          --directory "$RUNNER_TEMP/web-validation-resources-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$RESOURCE_CHECKPOINT_SCOPE"
      - name: Require final live composite quiescence and final-ledger release
        shell: bash
        env:
          RESOURCE_CHECKPOINT_SCOPE: qualification-live
        run: >-
          exec python3 -B scripts/hosted-validation-resource-checkpoint.py quiescence
          --directory "$RUNNER_TEMP/web-validation-resources-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$RESOURCE_CHECKPOINT_SCOPE"
      - name: Emergency exact-owner cleanup of the completed qualification worker
        if: always()
        shell: bash
        env:
          RESOURCE_CHECKPOINT_SCOPE: qualification-complete
        run: >-
          exec python3 -B scripts/hosted-validation-resource-checkpoint.py emergency-cleanup
          --directory "$RUNNER_TEMP/web-validation-resources-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$RESOURCE_CHECKPOINT_SCOPE"
      - name: Emergency exact-owner cleanup of the live qualification worker
        if: always()
        shell: bash
        env:
          RESOURCE_CHECKPOINT_SCOPE: qualification-live
        run: >-
          exec python3 -B scripts/hosted-validation-resource-checkpoint.py emergency-cleanup
          --directory "$RUNNER_TEMP/web-validation-resources-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$RESOURCE_CHECKPOINT_SCOPE"
      - name: Preserve feature qualification cleanup receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: web-validation-resource-qualification-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/web-validation-resources-${{ github.run_id }}-${{ github.run_attempt }}-qualification-complete/cleanup.json
            ${{ runner.temp }}/web-validation-resources-${{ github.run_id }}-${{ github.run_attempt }}-qualification-complete/emergency-cleanup.json
            ${{ runner.temp }}/web-validation-resources-${{ github.run_id }}-${{ github.run_attempt }}-qualification-complete/quiescence.json
            ${{ runner.temp }}/web-validation-resources-${{ github.run_id }}-${{ github.run_attempt }}-qualification-complete/verification.json
            ${{ runner.temp }}/web-validation-resources-${{ github.run_id }}-${{ github.run_attempt }}-qualification-live/cleanup.json
            ${{ runner.temp }}/web-validation-resources-${{ github.run_id }}-${{ github.run_attempt }}-qualification-live/emergency-cleanup.json
            ${{ runner.temp }}/web-validation-resources-${{ github.run_id }}-${{ github.run_attempt }}-qualification-live/quiescence.json
            ${{ runner.temp }}/web-validation-resources-${{ github.run_id }}-${{ github.run_attempt }}-qualification-live/verification.json
          retention-days: 7
          if-no-files-found: error

  validate:
    name: validate
    needs: [focused, resource_checkpoint_qualification]
    if: always()
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
      MSBUILDDISABLENODEREUSE: '1'
      UseSharedCompilation: 'false'
      MalievWorkspaceRoot: ${{ github.workspace }}/.dependencies
      MALIEV_WEB_STARTUP_PROOF: hosted-owned
      MALIEV_BILLING_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      MALIEV_BROWSER_EVIDENCE_DIR: ${{ github.workspace }}/sidebar-navigation-test-results
    steps:
      - name: Require successful focused validation
        id: focused_guard
        shell: bash
        env:
          FOCUSED_RESULT: ${{ needs.focused.result }}
          RESOURCE_QUALIFICATION_RESULT: ${{ needs.resource_checkpoint_qualification.result }}
        run: |
          if [[ "$FOCUSED_RESULT" != "success" || "$RESOURCE_QUALIFICATION_RESULT" != "success" ]]; then
            echo 'Focused validation or resource checkpoint qualification did not succeed; full validation is rejected.' >&2
            exit 1
          fi
      - name: Check out Web
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check out Legacy.Maliev.ServiceDefaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: 4ffba0639620e7e923d331317f3f28501526b573
          path: .dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Check out Legacy.Maliev.CompatibilityContracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
          path: .dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Verify offline Search Console cohort reporter
        shell: pwsh
        run: ./tests/SearchConsoleCohortReport.Tests.ps1
      - name: Set up original Career oracle runtime
        timeout-minutes: 5
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 8.0.x
      - name: Build original Career materialization oracle
        timeout-minutes: 5
        run: >-
          dotnet build acceptance/CareerOriginalMaterialization/CareerOriginalMaterialization.Tests.csproj
          --configuration Release --disable-build-servers -warnaserror
          -p:UseSharedCompilation=false -nodeReuse:false
      - name: Verify original Career materialization oracle
        timeout-minutes: 5
        run: >-
          dotnet test acceptance/CareerOriginalMaterialization/CareerOriginalMaterialization.Tests.csproj
          --configuration Release --no-build --no-restore --disable-build-servers
          -p:UseSharedCompilation=false -nodeReuse:false
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --logger trx --results-directory ./career-original-materialization-test-results
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Legacy.Maliev.Web/package-lock.json
      - name: Build deterministic browser assets
        working-directory: Legacy.Maliev.Web
        run: npm run ci
      - name: Verify committed browser assets
        run: git diff --exit-code -- Legacy.Maliev.Web/wwwroot/dist
      - name: Verify frozen source-parity manifest
        shell: pwsh
        run: ./scripts/verify-complete-source-history-parity.ps1 -ManifestOnly
      - name: Build exact-pinned disposable profile boundary services
        shell: pwsh
        run: ./scripts/prepare-profile-producer-boundary.ps1
      - name: Build exact-pinned disposable member authentication proof
        shell: pwsh
        run: ./scripts/prepare-member-auth-indexing-proof.ps1
      - name: Build exact-pinned Catalog for member billing persistence proof
        shell: pwsh
        run: ./scripts/prepare-billing-catalog-proof.ps1
      - name: Build exact-pinned disposable SCB payment boundary service
        shell: pwsh
        run: ./scripts/prepare-scb-payment-boundary.ps1
      - name: Build browser acceptance host
        run: GITHUB_ACTIONS=false dotnet build Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj --configuration Release
      - name: Install pinned Chromium browser
        shell: bash
        timeout-minutes: 8
        run: |
          # Use the signed official HTTPS archive after the hosted Azure mirror stalled.
          test -s /etc/apt/apt-mirrors.txt
          python3 -c 'from pathlib import Path; s=Path("/etc/apt/sources.list.d/ubuntu.sources").read_text(); assert "mirror+file:/etc/apt/apt-mirrors.txt" in s and "Signed-By:" in s, "Unexpected hosted Ubuntu source policy"'
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          pwsh -NoProfile -File ./Legacy.Maliev.Web.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Retain original Redis image cache or registry quota snapshot before startup
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 ./startup-image-acquisition
          python3 -B scripts/probe-startup-dockerhub-quota.py \
            --receipt ./startup-image-acquisition/dockerhub-quota.json --check-local-cache
      - name: Prepare isolated hash-pinned preliminary PDF verification runtime
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import sys; print("PDF verifier Python", sys.version.split()[0]); sys.exit(0 if sys.version_info >= (3, 11) else "Preliminary PDF proof requires Python >=3.11")'
          proof_runner_root="$(realpath -- "$RUNNER_TEMP")"
          proof_directory="$(mktemp -d "$proof_runner_root/maliev-web-pdf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
          cleanup_failed_pdf_setup() {
            proof_setup_status="$?"
            trap - EXIT
            if [[ "$proof_setup_status" -eq 0 ]]; then return; fi
            set +e
            proof_cleanup_path="$(realpath -- "$proof_directory")"
            if [[ "$proof_cleanup_path" != "$proof_directory" || "$(dirname -- "$proof_cleanup_path")" != "$proof_runner_root" ]]; then
              echo 'Refusing early cleanup outside owned temporary root.' >&2
              exit "$proof_setup_status"
            fi
            case "$(basename -- "$proof_cleanup_path")" in
              "maliev-web-pdf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-"*) ;;
              *) echo 'Refusing early cleanup for unknown temporary prefix.' >&2; exit "$proof_setup_status" ;;
            esac
            if [[ -f "$proof_cleanup_path/.maliev-web-pdf-owned" && ! -L "$proof_cleanup_path/.maliev-web-pdf-owned" ]] &&
               [[ "$(cat -- "$proof_cleanup_path/.maliev-web-pdf-owned")" == "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" ]]; then
              rm -rf -- "$proof_cleanup_path"
            else
              # Exact mktemp ownership permits only empty-directory removal without a marker.
              rmdir -- "$proof_cleanup_path" || echo 'Early cleanup refused: directory is nonempty or ownership marker is uncertain.' >&2
            fi
            if [[ -e "$proof_cleanup_path" || -L "$proof_cleanup_path" ]]; then
              echo 'Owned PDF setup directory remains after cleanup attempt.' >&2
            fi
            exit "$proof_setup_status"
          }
          trap cleanup_failed_pdf_setup EXIT
          printf '%s:%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$proof_directory/.maliev-web-pdf-owned"
          printf 'WEB_PRELIMINARY_PDF_VENV=%s\n' "$proof_directory" >> "$GITHUB_ENV"
          python3 -m venv "$proof_directory"
          "$proof_directory/bin/python" -m pip install \
            --disable-pip-version-check --no-input --require-hashes \
            --only-binary=:all: --no-deps --timeout 30 --retries 1 \
            --requirement tests/preliminary-pdf-requirements.txt
      - name: Verify preliminary PDF parser rejection controls
        timeout-minutes: 1
        shell: bash
        run: '"$WEB_PRELIMINARY_PDF_VENV/bin/python" tests/PreliminaryPdfProofGuardTests.py'
      - name: Verify hosted resource checkpoint controls
        shell: bash
        run: python3 -B tests/HostedValidationResourceCheckpointTests.py
      - name: Retain bounded resource checkpoints during full validation
        id: resource_checkpoints
        background: true
        timeout-minutes: 125
        uses: ./.github/actions/validation-resource-checkpoints
        with:
          mode: full
      - name: Validate .NET solution
        id: full_dotnet_validation
        env:
          VSTestDiag: ${{ runner.temp }}/web-validation-resources-${{ github.run_id }}-${{ github.run_attempt }}-full/vstest.diag
        uses: MALIEV-Co-Ltd/Legacy.Maliev.Workflows/actions/dotnet-validate@e5732037fe94b7ed6e5be2cd4c23dbf6ef5e2617
        with:
          solution: Legacy.Maliev.Web.slnx
          use-local-maliev-dependencies: 'true'
      - name: Gate raw generated-inclusive Web coverage
        if: always() && steps.focused_guard.outcome == 'success'
        shell: pwsh
        run: |
          ./tests/WebFxRawCoverage.Tests.ps1
          ./tests/Test-WebFxRawCoverage.ps1 -ResultsRoot ./Legacy.Maliev.Web.Tests/TestResults
      - name: Verify full-suite preliminary PDF structure and exact-byte manifests
        timeout-minutes: 1
        shell: bash
        run: >-
          "$WEB_PRELIMINARY_PDF_VENV/bin/python" scripts/verify-preliminary-pdf-proof.py
          --root ./Legacy.Maliev.Web.Tests/bin/Release/net10.0/TestResults/preliminary-pdf-proof
          --receipt ./preliminary-pdf-full-proof/parser-receipt.json
      - name: Retain exact full-suite revision and result identity
        if: always() && steps.focused_guard.outcome == 'success'
        shell: bash
        env:
          FULL_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FULL_EVENT_SHA: ${{ github.sha }}
          FULL_RUN_ID: ${{ github.run_id }}
          FULL_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import hashlib, itertools, json, os, re, subprocess, xml.etree.ElementTree as ET
          from pathlib import Path
          root = Path.cwd()
          def git(ref):
              return subprocess.check_output(['git', 'rev-parse', ref], timeout=10, text=True).strip()
          identity = {key: os.environ['FULL_' + key.upper()] for key in ['candidate_sha', 'event_sha', 'run_id', 'attempt']}
          checked_head, checked_tree = git('HEAD'), git('HEAD^{tree}')
          if not all(re.fullmatch('[0-9a-f]{40}', value) for value in
                     [identity['candidate_sha'], identity['event_sha'], checked_head, checked_tree]):
              raise RuntimeError('Invalid full-suite revision identity')
          if checked_head != identity['event_sha']:
              raise RuntimeError('Full-suite checkout differs from the original workflow event')
          if not all(re.fullmatch('[1-9][0-9]{0,19}', identity[key]) for key in ['run_id', 'attempt']):
              raise RuntimeError('Invalid full-suite run identity')
          source_bytes = [0]
          def record(path):
              if path.is_symlink() or not path.is_file() or not path.resolve().is_relative_to(root.resolve()):
                  raise RuntimeError('Invalid full-suite evidence file')
              limit = 64 * 1024 * 1024
              before = path.stat()
              if not 0 < before.st_size <= min(limit, 128 * 1024 * 1024 - source_bytes[0]):
                  raise RuntimeError('Full-suite evidence exceeds bounded receipt')
              descriptor = os.open(path, os.O_RDONLY | getattr(os, 'O_NOFOLLOW', 0))
              with os.fdopen(descriptor, 'rb') as stream:
                  opened = os.fstat(stream.fileno())
                  identity = lambda info: (info.st_dev, info.st_ino, info.st_size, info.st_mtime_ns)
                  if identity(opened) != identity(before):
                      raise RuntimeError('Full-suite evidence changed before receipt')
                  data = stream.read(limit + 1)
                  if not len(data) == before.st_size or identity(os.fstat(stream.fileno())) != identity(before):
                      raise RuntimeError('Full-suite evidence changed during receipt')
              if path.is_symlink() or identity(path.stat()) != identity(before):
                  raise RuntimeError('Full-suite evidence changed after receipt')
              source_bytes[0] += len(data)
              return ({'path': path.relative_to(root).as_posix(), 'bytes': len(data),
                       'sha256': hashlib.sha256(data).hexdigest()}, data)
          assembly_directory = root / 'Legacy.Maliev.Web.Tests/bin/Release/net10.0'
          names = ['Legacy.Maliev.Web.Tests.dll', 'Legacy.Maliev.Web.dll',
                   'Legacy.Maliev.Web.Application.dll', 'Legacy.Maliev.Web.Infrastructure.dll']
          binaries = [record(assembly_directory / name)[0] for name in names]
          reports = []
          namespace = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          paths = list(itertools.islice((root / 'Legacy.Maliev.Web.Tests/TestResults').rglob('*.trx'), 17))
          if not 0 < len(paths) <= 16:
              raise RuntimeError('Full-suite TRX metadata report bound exceeded')
          allowed_counters = {'total', 'executed', 'passed', 'failed', 'error', 'timeout', 'aborted',
                              'inconclusive', 'passedButRunAborted', 'notRunnable', 'notExecuted',
                              'disconnected', 'warning', 'completed', 'inProgress', 'pending'}
          allowed_outcomes = {'Completed', 'Passed', 'Failed', 'Error', 'Timeout', 'Aborted',
                              'Inconclusive', 'PassedButRunAborted', 'NotRunnable', 'NotExecuted',
                              'Disconnected', 'Warning', 'InProgress', 'Pending'}
          for path in sorted(paths):
              entry, data = record(path)
              if b'<!DOCTYPE' in data.upper() or b'<!ENTITY' in data.upper():
                  raise RuntimeError('Invalid full-suite TRX document')
              document = ET.fromstring(data)
              summary = document.find('t:ResultSummary', namespace)
              counters = summary.find('t:Counters', namespace) if summary is not None else None
              if counters is None:
                  raise RuntimeError('Full-suite TRX counters missing')
              if summary.get('outcome') not in allowed_outcomes:
                  raise RuntimeError('Full-suite TRX outcome metadata rejected')
              if not counters.attrib or not set(counters.attrib).issubset(allowed_counters):
                  raise RuntimeError('Full-suite TRX counter metadata rejected')
              values = {}
              for key, value in counters.attrib.items():
                  if not re.fullmatch('[0-9]{1,10}', value) or int(value) > 2147483647:
                      raise RuntimeError('Full-suite TRX counter value metadata rejected')
                  values[key] = int(value)
              entry['outcome'] = summary.get('outcome')
              entry['counters'] = values
              reports.append(entry)
          if not reports:
              raise RuntimeError('No full-suite TRX identity to retain')
          directory = root / 'full-suite-identity'
          directory.mkdir(exist_ok=False)
          receipt = {'schema': 'web-full-suite-identity.v1', **identity,
                     'checked_head': checked_head, 'checked_tree': checked_tree,
                     'binaries': binaries, 'reports': reports, 'source_bytes': source_bytes[0],
                     'scope': 'actual unfiltered full-suite TRX identity; no discovery, filtering or coverage aggregation'}
          encoded = (json.dumps(receipt, sort_keys=True, indent=2) + '\n').encode('utf-8')
          if len(encoded) > 256 * 1024:
              raise RuntimeError('Full-suite identity receipt exceeds metadata byte bound')
          with (directory / 'receipt.json').open('xb') as output:
              output.write(encoded)
          PY
      - name: Remove only the owned preliminary PDF verification runtime
        if: always() && steps.focused_guard.outcome == 'success'
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${WEB_PRELIMINARY_PDF_VENV:-}" ]]; then exit 0; fi
          if [[ ! -e "$WEB_PRELIMINARY_PDF_VENV" && ! -L "$WEB_PRELIMINARY_PDF_VENV" ]]; then exit 0; fi
          proof_runner_root="$(realpath -- "$RUNNER_TEMP")"
          proof_directory="$(realpath -- "$WEB_PRELIMINARY_PDF_VENV")"
          [[ "$proof_directory" == "$WEB_PRELIMINARY_PDF_VENV" ]]
          [[ "$(dirname -- "$proof_directory")" == "$proof_runner_root" ]]
          case "$(basename -- "$proof_directory")" in
            "maliev-web-pdf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-"*) ;;
            *) echo 'Refusing cleanup outside the owned preliminary PDF runtime.' >&2; exit 1 ;;
          esac
          [[ -f "$proof_directory/.maliev-web-pdf-owned" && ! -L "$proof_directory/.maliev-web-pdf-owned" ]]
          [[ "$(cat -- "$proof_directory/.maliev-web-pdf-owned")" == "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" ]]
          rm -rf -- "$proof_directory"
          [[ ! -e "$proof_directory" && ! -L "$proof_directory" ]]
      - name: Stop the owned resource checkpoint step
        cancel: resource_checkpoints
      - name: Require the outer resource collector cancellation or natural completion
        if: always() && steps.focused_guard.outcome == 'success'
        shell: bash
        env:
          COLLECTOR_OUTCOME: ${{ steps.resource_checkpoints.outcome }}
          COLLECTOR_CONCLUSION: ${{ steps.resource_checkpoints.conclusion }}
        run: |
          python3 - <<'PY'
          import os
          outcome = os.environ['COLLECTOR_OUTCOME']
          if outcome not in ('cancelled', 'success') or os.environ['COLLECTOR_CONCLUSION'] != outcome:
              raise RuntimeError('Hosted outer resource collector state was not accepted')
          PY
      - name: Require exact-owner cleanup of the full resource checkpoint worker
        if: always() && steps.focused_guard.outcome == 'success'
        shell: bash
        env:
          RESOURCE_CHECKPOINT_SCOPE: full
        run: >-
          exec python3 -B scripts/hosted-validation-resource-checkpoint.py cleanup
          --directory "$RUNNER_TEMP/web-validation-resources-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$RESOURCE_CHECKPOINT_SCOPE"
      - name: Independently verify the full resource checkpoint worker released
        if: always() && steps.focused_guard.outcome == 'success'
        shell: bash
        env:
          RESOURCE_CHECKPOINT_SCOPE: full
        run: >-
          exec python3 -B scripts/hosted-validation-resource-checkpoint.py released
          --directory "$RUNNER_TEMP/web-validation-resources-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$RESOURCE_CHECKPOINT_SCOPE"
      - name: Require final full composite quiescence and final-ledger release
        if: always() && steps.focused_guard.outcome == 'success'
        shell: bash
        env:
          RESOURCE_CHECKPOINT_SCOPE: full
          WEB_FULL_DOTNET_OUTCOME: ${{ steps.full_dotnet_validation.outcome }}
        run: >-
          exec python3 -B scripts/hosted-validation-resource-checkpoint.py quiescence
          --directory "$RUNNER_TEMP/web-validation-resources-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$RESOURCE_CHECKPOINT_SCOPE"
      - name: Emergency exact-owner cleanup of the full resource checkpoint worker
        if: always() && steps.focused_guard.outcome == 'success'
        shell: bash
        env:
          RESOURCE_CHECKPOINT_SCOPE: full
        run: >-
          exec python3 -B scripts/hosted-validation-resource-checkpoint.py emergency-cleanup
          --directory "$RUNNER_TEMP/web-validation-resources-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$RESOURCE_CHECKPOINT_SCOPE"
      - name: Preserve resource checkpoint cleanup receipt
        if: always() && steps.focused_guard.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: web-validation-resource-cleanup-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/web-validation-resources-${{ github.run_id }}-${{ github.run_attempt }}-full/cleanup.json
            ${{ runner.temp }}/web-validation-resources-${{ github.run_id }}-${{ github.run_attempt }}-full/emergency-cleanup.json
            ${{ runner.temp }}/web-validation-resources-${{ github.run_id }}-${{ github.run_attempt }}-full/quiescence.json
            ${{ runner.temp }}/web-validation-resources-${{ github.run_id }}-${{ github.run_attempt }}-full/verification.json
          retention-days: 7
          if-no-files-found: error
      - name: Preserve independent focused groups and full raw coverage evidence
        if: always() && steps.focused_guard.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
