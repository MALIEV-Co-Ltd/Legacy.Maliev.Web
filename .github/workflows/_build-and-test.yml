name: Build and test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    env:
      MalievWorkspaceRoot: ${{ github.workspace }}/.dependencies
    steps:
      - name: Check out Web
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out Legacy.Maliev.ServiceDefaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: 3c790ba6414b2a539f24aabb6948549ffd81a86b
          path: .dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Check out Legacy.Maliev.CompatibilityContracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
          path: .dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Verify offline Search Console cohort reporter
        shell: pwsh
        run: ./tests/SearchConsoleCohortReport.Tests.ps1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Legacy.Maliev.Web/package-lock.json
      - name: Build deterministic browser assets
        working-directory: Legacy.Maliev.Web
        run: npm run ci
      - name: Verify committed browser assets
        run: git diff --exit-code -- Legacy.Maliev.Web/wwwroot/dist
      - name: Verify frozen source-parity manifest
        shell: pwsh
        run: ./scripts/verify-complete-source-history-parity.ps1 -ManifestOnly
      - name: Build exact-pinned disposable profile boundary services
        shell: pwsh
        run: ./scripts/prepare-profile-producer-boundary.ps1
      - name: Build exact-pinned disposable member authentication proof
        shell: pwsh
        run: ./scripts/prepare-member-auth-indexing-proof.ps1
      - name: Build exact-pinned disposable SCB payment boundary service
        shell: pwsh
        run: ./scripts/prepare-scb-payment-boundary.ps1
      - name: Build browser acceptance host
        run: GITHUB_ACTIONS=false dotnet build Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj --configuration Release
      - name: Verify protected ticket currency identity
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~ProtectedTicket_NonCanonicalCurrencyOrRate_IsRejected|FullyQualifiedName~IssuedTickets_CanonicalThbIdentityAndEngineerReview_RemainValid"
          --logger trx --results-directory ./ticket-test-results
      - name: Install pinned Chromium browser
        shell: pwsh
        run: ./Legacy.Maliev.Web.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Verify regressions reject exact pre-fix pricing source and restore patched HEAD
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 tests/ComparisonCallbackRegressionGuardTests.py
          python3 scripts/verify-comparison-callback-regression.py
      - name: Preserve separate expected-failure pricing regression control
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pricing-regression-parent-control-${{ github.sha }}
          path: pricing-regression-parent-control/**
          retention-days: 7
          if-no-files-found: error
      - name: Verify accepted publisher, original nine meshes and pricing callback budgets
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~PublishWorkflowPermissionContractTests|FullyQualifiedName~NineGeneratedStlUploadsKeepDistinctReviewAndPreliminaryPreviews|FullyQualifiedName~ComparisonCallback"
          --logger trx --results-directory ./publisher-mesh-test-results
      - name: Verify localized physical result, actual summary and consent browser boundaries
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~InstantQuotationPhysicalResultRendererTests|FullyQualifiedName~InstantQuotationSummaryTransitionBrowserTests|FullyQualifiedName~PublicCookieConsentMigrationTests|FullyQualifiedName~PublicCookieConsentBrowserTests|FullyQualifiedName~MeasurementLifecycleBrowserTests"
          --logger trx --results-directory ./physical-result-test-results
      - name: Verify Accounting numeric email state response compatibility
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~CustomerQuotationClientTests"
          --logger trx --results-directory ./quotation-response-test-results
      - name: Verify localized Knowledge sidebar and actual keyboard navigation
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~KnowledgeSidebarRouteTests|FullyQualifiedName~KnowledgeSidebarBrowserTests"
          --logger trx --results-directory ./knowledge-navigation-test-results
      - name: Verify localized ordered Home process across active and retained renderers
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~HomeStaticSsrRouteTests"
          --logger trx --results-directory ./home-process-test-results
      - name: Verify resolved material identity across Catalog and Order boundaries
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~EsdFulfillmentContractTests|FullyQualifiedName~InstantQuotationFulfillmentMappingTests"
          --logger trx --results-directory ./material-identity-test-results
      - name: Verify signed-link whole-operation deadline and compatibility
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~CncSignedLinkClientTests"
          --logger trx --results-directory ./signed-link-test-results
      - name: Verify startup security migration and encrypted Redis environment isolation
        run: >-
          dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath=
          --filter "FullyQualifiedName~StartupDataProtectionMigrationTests|FullyQualifiedName~RecaptchaConfigurationStartupTests|FullyQualifiedName~RecaptchaEnterpriseVerifierTests|FullyQualifiedName~AppSettingsCredentialBoundaryTests|FullyQualifiedName~ArchitectureTests|FullyQualifiedName~HealthProcessIdentityContractTests|FullyQualifiedName~PrivateRequestObservationConsumerTests|FullyQualifiedName~LegacyServiceDefaultsIdentityContractTests|FullyQualifiedName~SharedDiagnosticsContractTests|FullyQualifiedName~ErrorIncidentCorrelationTests"
          --logger trx --results-directory ./startup-security-test-results
      - name: Validate .NET solution
        uses: MALIEV-Co-Ltd/Legacy.Maliev.Workflows/actions/dotnet-validate@d7efac266bc66273bc45eab583618871292ecbd6
        with:
          solution: Legacy.Maliev.Web.slnx
          use-local-maliev-dependencies: 'true'
      - name: Gate raw generated-inclusive Web coverage
        if: always()
        shell: pwsh
        run: |
          ./tests/WebFxRawCoverage.Tests.ps1
          ./tests/Test-WebFxRawCoverage.ps1 -ResultsRoot ./Legacy.Maliev.Web.Tests/TestResults
      - name: Preserve independent focused groups and full raw coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-combined-native-${{ github.sha }}
          path: |
            Legacy.Maliev.Web.Tests/TestResults/**/*.trx
            Legacy.Maliev.Web.Tests/TestResults/**/coverage.json
            Legacy.Maliev.Web.Tests/TestResults/**/coverage.cobertura.xml
            ticket-test-results/**/*.trx
            publisher-mesh-test-results/**/*.trx
            physical-result-test-results/**/*.trx
            quotation-response-test-results/**/*.trx
            knowledge-navigation-test-results/**/*.trx
            home-process-test-results/**/*.trx
            material-identity-test-results/**/*.trx
            signed-link-test-results/**/*.trx
            startup-security-test-results/**/*.trx
            Legacy.Maliev.Web.Tests/TestResults/knowledge-navigation-browser/*.png
            Legacy.Maliev.Web.Tests/TestResults/knowledge-navigation-browser/*.json
            tests/web-fx-generated-inclusive.runsettings
          retention-days: 7
          if-no-files-found: error
