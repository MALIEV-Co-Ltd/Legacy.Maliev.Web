            Legacy.Maliev.Web/wwwroot/dist/route-service-cnc.js
            Legacy.Maliev.Web/wwwroot/dist/route-service-finishing.js
            Legacy.Maliev.Web/wwwroot/dist/route-service-scanning.js
            Legacy.Maliev.Web/wwwroot/dist/route-instant-quotation.css
            Legacy.Maliev.Web/wwwroot/dist/route-instant-quotation.js
            Legacy.Maliev.Web.Tests/TestResults/**/*.trx
