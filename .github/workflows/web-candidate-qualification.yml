        focused --id step-19 -- bash -e -o pipefail -c 'dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
        --configuration Release --no-build --no-restore -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath= --filter "FullyQualifiedName~InstantQuotationPhysicalResultRendererTests|FullyQualifiedName~InstantQuotationSummaryTransitionBrowserTests|FullyQualifiedName~PublicCookieConsentMigrationTests|FullyQualifiedName~PublicCookieConsentBrowserTests|FullyQualifiedName~MeasurementLifecycleBrowserTests"
        --logger trx --results-directory ./physical-result-test-results'
