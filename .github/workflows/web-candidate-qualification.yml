        printf 'RESIN_EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
        printf 'RESIN_ENROLLMENT_CONTEXT=%s\n' "$evidence/enrolled-context.json" >> "$GITHUB_ENV"
        python3 -B "$WEB_TRANSPORT_ROOT/resin_expiry_enrollment.py" --challenge "$evidence/challenge.json"
    - name: Retain original paired expiry challenge for the assigned custodian
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: resin-expiry-challenge-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/resin-expiry-evidence-${{ github.run_id }}-${{ github.run_attempt }}/challenge.json
        retention-days: 7
        if-no-files-found: error
    - name: Read independently enrolled paired expiry custody and materialize exact source
      timeout-minutes: 5
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        MANIFEST_BLOB: ${{ inputs.manifest_blob }}
        CAPSULE_BLOB: ${{ inputs.capsule_blob }}
      run: |
        set -euo pipefail
        python3 -B "$WEB_TRANSPORT_ROOT/resin_expiry_enrollment.py" --challenge "$RESIN_EVIDENCE/challenge.json" --wait --context "$RESIN_ENROLLMENT_CONTEXT" --permit "$RESIN_EVIDENCE/root-permit.json"
        python3 -B "$WEB_TRANSPORT_ROOT/check_web_candidate_admission.py" --policy "$WEB_TRANSPORT_ROOT/web-resin-comparison-expiry-policy.json" --permit "$RESIN_EVIDENCE/root-permit.json"
        python3 -B "$WEB_TRANSPORT_ROOT/materialize_web_candidate.py" --policy "$WEB_TRANSPORT_ROOT/web-resin-comparison-expiry-policy.json" --candidate . --manifest-blob "$MANIFEST_BLOB" --capsule-blob "$CAPSULE_BLOB" --receipt "$RESIN_EVIDENCE/intake.json"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
        ref: 3c790ba6414b2a539f24aabb6948549ffd81a86b
        path: .dependencies/Legacy.Maliev.ServiceDefaults
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
        ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
        path: .dependencies/Legacy.Maliev.CompatibilityContracts
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: actions/setup-dotnet
        ref: a98b56852c35b8e3190ac28c8c2271da59106c68
        path: .dependencies/dotnet-installer
        persist-credentials: false
    - name: Execute exactly the two paired expiry rows in the existing finite kernel owner
      timeout-minutes: 36
      shell: bash
      run: |
        set -euo pipefail
        python3 -B "$WEB_TRANSPORT_ROOT/launch_web_capped_kernel_proof.py" --resin-policy "$WEB_TRANSPORT_ROOT/web-resin-comparison-expiry-policy.json" --permit "$RESIN_EVIDENCE/root-permit.json" --candidate "$GITHUB_WORKSPACE" --evidence "$RESIN_EVIDENCE/owner"
        python3 -B "$WEB_TRANSPORT_ROOT/run_web_resin_comparison_expiry.py" --verify-final "$RESIN_EVIDENCE/owner"
    - name: Retain exact paired source, raw TRX and owned cleanup receipts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: resin-expiry-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/resin-expiry-evidence-${{ github.run_id }}-${{ github.run_attempt }}/
          resin-comparison-expiry-results/
        retention-days: 7
        if-no-files-found: error
