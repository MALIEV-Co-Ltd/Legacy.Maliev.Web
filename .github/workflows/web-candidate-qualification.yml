name: Web sealed source qualification
'on':
  pull_request:
    paths:
    - .gitleaks.toml
    - scripts/tests/test_web_candidate_secret_scan.py
    - scripts/run_web_account_candidate.py
    - scripts/run_web_resin_comparison_expiry.py
    - scripts/resin_expiry_enrollment.py
    - scripts/web-resin-comparison-expiry-policy.json
    - scripts/launch_web_capped_kernel_proof.py
    - scripts/tests/test_web_candidate_resin_expiry.py
    - scripts/tests/test_web_candidate_resin_enrollment.py
    - scripts/web-account-failure-policy.json
    - scripts/web-email-change-session-policy.json
    - scripts/tests/test_web_candidate_email_session.py
    - scripts/tests/test_web_candidate_account.py
    - docs/web-account-failure-transport-policy.schema.json
    - scripts/materialize_web_candidate.py
    - scripts/check_web_candidate_admission.py
    - scripts/tests/test_materialize_web_candidate.py
    - scripts/tests/test_web_candidate_admission.py
    - scripts/web-candidate-policy.json
    - .github/workflows/web-candidate-qualification.yml
    - docs/web-sealed-source-transport.md
    - scripts/prepare_qualified_web_profile.py
    - scripts/run_web_candidate_phase.py
    - scripts/tests/test_web_candidate_phase.py
    - scripts/sealed_source_capsule.py
    - scripts/tests/test_sealed_source_capsule.py
  workflow_dispatch:
    inputs:
      slice:
        description: Reviewed candidate intake profile
        required: true
        default: existing
        type: choice
        options:
        - existing
        - email-change-session-v1
        - resin-comparison-expiry-v1
      manifest_blob:
        description: Same-repository Git blob ID of reviewed manifest
        required: true
        type: string
      capsule_blob:
        description: Same-repository Git blob ID of exact raw ZIP
        required: true
        type: string
      admission_blob:
        description: Same-repository Git blob ID of independently reviewed Root hosted permit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: web-sealed-source-qualification
  cancel-in-progress: false
jobs:
  transport-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Verify shared extractor raw-byte seal
      run: python3 -B -c 'import hashlib,json; from pathlib import Path; p=json.loads(Path("scripts/web-candidate-policy.json").read_bytes());
        assert hashlib.sha256(Path("scripts/sealed_source_capsule.py").read_bytes()).hexdigest()==p["sharedExtractorSha256"],
        "Shared extractor bytes changed"'
    - name: Verify distinct account policy raw-byte seal
      run: python3 -B -c 'import materialize_web_candidate as m; m.load_policy("scripts/web-account-failure-policy.json")'
      env:
        PYTHONPATH: scripts
    - name: Run capsule and native admission rejection controls
      run: 'python3 -B -m unittest discover -s scripts/tests -p ''test_*web_candidate*.py''

        python3 -B -m unittest discover -s scripts/tests -p ''test_sealed_source_capsule.py'''
  candidate-native:
    name: validate
    runs-on: ubuntu-latest
    env:
      MalievWorkspaceRoot: ${{ github.workspace }}/.dependencies
      MALIEV_WEB_STARTUP_PROOF: hosted-owned
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      MSBUILDDISABLENODEREUSE: '1'
    steps:
    - name: Check out protected transport
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Retain reviewed transport outside candidate checkout
      shell: bash
      run: 'set -euo pipefail

        transport_root="$RUNNER_TEMP/web-transport-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

        mkdir "$transport_root"

        cp scripts/materialize_web_candidate.py scripts/check_web_candidate_admission.py scripts/web-candidate-policy.json
        scripts/run_web_candidate_phase.py scripts/prepare_qualified_web_profile.py scripts/sealed_source_capsule.py "$transport_root/"

        printf "WEB_TRANSPORT_ROOT=%s\n" "$transport_root" >> "$GITHUB_ENV"

        printf "WEB_REVIEWED_TRANSPORT_SHA=%s\n" "$(git rev-parse HEAD)" >> "$GITHUB_ENV"'
    - name: Check out exact sealed Web base
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 0b036c813d25d4d7785ad66be6e10b54f2432381
        persist-credentials: false
    - name: Materialize sealed raw source and verify reviewed native admission
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        MANIFEST_BLOB: ${{ inputs.manifest_blob }}
        CAPSULE_BLOB: ${{ inputs.capsule_blob }}
        ADMISSION_BLOB: ${{ inputs.admission_blob }}
      run: 'set -euo pipefail

        mkdir -p "$RUNNER_TEMP/web-candidate-evidence"

        python3 -B "$WEB_TRANSPORT_ROOT/check_web_candidate_admission.py" --policy "$WEB_TRANSPORT_ROOT/web-candidate-policy.json"
        --blob "$ADMISSION_BLOB" --permit "$RUNNER_TEMP/web-candidate-evidence/root-permit.json"

        python3 -B "$WEB_TRANSPORT_ROOT/materialize_web_candidate.py" --policy "$WEB_TRANSPORT_ROOT/web-candidate-policy.json"
        --candidate . --manifest-blob "$MANIFEST_BLOB" --capsule-blob "$CAPSULE_BLOB" --receipt "$RUNNER_TEMP/web-candidate-evidence/intake.json"'
    - name: Check out Legacy.Maliev.ServiceDefaults
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
        ref: 3c790ba6414b2a539f24aabb6948549ffd81a86b
        path: .dependencies/Legacy.Maliev.ServiceDefaults
        persist-credentials: false
    - name: Check out Legacy.Maliev.CompatibilityContracts
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
        ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
        path: .dependencies/Legacy.Maliev.CompatibilityContracts
        persist-credentials: false
    - name: Verify offline Search Console cohort reporter
      shell: bash
      run: python3 -B "$WEB_TRANSPORT_ROOT/run_web_candidate_phase.py" --policy "$WEB_TRANSPORT_ROOT/web-candidate-policy.json"
        --permit "$RUNNER_TEMP/web-candidate-evidence/root-permit.json" --evidence "$RUNNER_TEMP/web-candidate-evidence" --phase
        static --id step-6 -- pwsh -NoProfile -Command ./tests/SearchConsoleCohortReport.Tests.ps1
      timeout-minutes: 22
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: Legacy.Maliev.Web/package-lock.json
    - name: Build deterministic browser assets
      working-directory: Legacy.Maliev.Web
      run: python3 -B "$WEB_TRANSPORT_ROOT/run_web_candidate_phase.py" --policy "$WEB_TRANSPORT_ROOT/web-candidate-policy.json"
        --permit "$RUNNER_TEMP/web-candidate-evidence/root-permit.json" --evidence "$RUNNER_TEMP/web-candidate-evidence" --phase
        assets --id step-8 -- bash -e -o pipefail -c 'npm run ci'
      timeout-minutes: 22
      shell: bash
    - name: Record normal generated asset postimages
      run: 'python3 -B "$WEB_TRANSPORT_ROOT/run_web_candidate_phase.py" --policy "$WEB_TRANSPORT_ROOT/web-candidate-policy.json"
        --permit "$RUNNER_TEMP/web-candidate-evidence/root-permit.json" --evidence "$RUNNER_TEMP/web-candidate-evidence" --phase
        static --id step-9 -- bash -e -o pipefail -c ''python3 -B - <<''"''"''PY''"''"''

        import json,hashlib,os

        from pathlib import Path

        p=json.loads((Path(os.environ["WEB_TRANSPORT_ROOT"])/"web-candidate-policy.json").read_bytes())

        rows=[dict(path=n,bytes=Path(n).stat().st_size,sha256=hashlib.sha256(Path(n).read_bytes()).hexdigest()) for n in p["distPaths"]]

        (Path(os.environ["RUNNER_TEMP"])/"web-candidate-evidence/dist-postimage.json").write_text(json.dumps(rows,indent=2)+"\n")

        PY'''
      shell: bash
      timeout-minutes: 22
    - name: Verify frozen source-parity manifest
      shell: bash
      run: python3 -B "$WEB_TRANSPORT_ROOT/run_web_candidate_phase.py" --policy "$WEB_TRANSPORT_ROOT/web-candidate-policy.json"
        --permit "$RUNNER_TEMP/web-candidate-evidence/root-permit.json" --evidence "$RUNNER_TEMP/web-candidate-evidence" --phase
        static --id step-10 -- pwsh -NoProfile -Command './scripts/verify-complete-source-history-parity.ps1 -ManifestOnly'
      timeout-minutes: 22
    - name: Build browser acceptance host
      run: python3 -B "$WEB_TRANSPORT_ROOT/run_web_candidate_phase.py" --policy "$WEB_TRANSPORT_ROOT/web-candidate-policy.json"
        --permit "$RUNNER_TEMP/web-candidate-evidence/root-permit.json" --evidence "$RUNNER_TEMP/web-candidate-evidence" --phase
        build --id step-11 -- bash -e -o pipefail -c 'GITHUB_ACTIONS=false dotnet build Legacy.Maliev.Web.slnx -c Release
        -warnaserror -m:1 -nr:false -p:UseSharedCompilation=false'
      timeout-minutes: 22
      shell: bash
    - name: Build exact-pinned disposable profile boundary services
      shell: bash
      run: python3 -B "$WEB_TRANSPORT_ROOT/run_web_candidate_phase.py" --policy "$WEB_TRANSPORT_ROOT/web-candidate-policy.json"
        --permit "$RUNNER_TEMP/web-candidate-evidence/root-permit.json" --evidence "$RUNNER_TEMP/web-candidate-evidence" --phase
        build --id step-12 -- bash -e -o pipefail -c 'python3 -B "$WEB_TRANSPORT_ROOT/prepare_qualified_web_profile.py" --policy
        "$WEB_TRANSPORT_ROOT/web-candidate-policy.json" --candidate .'
      timeout-minutes: 22
    - name: Build exact-pinned disposable member authentication proof
      shell: bash
      run: python3 -B "$WEB_TRANSPORT_ROOT/run_web_candidate_phase.py" --policy "$WEB_TRANSPORT_ROOT/web-candidate-policy.json"
        --permit "$RUNNER_TEMP/web-candidate-evidence/root-permit.json" --evidence "$RUNNER_TEMP/web-candidate-evidence" --phase
        build --id step-13 -- pwsh -NoProfile -Command ./scripts/prepare-member-auth-indexing-proof.ps1
      timeout-minutes: 22
    - name: Build exact-pinned disposable SCB payment boundary service
      shell: bash
      run: python3 -B "$WEB_TRANSPORT_ROOT/run_web_candidate_phase.py" --policy "$WEB_TRANSPORT_ROOT/web-candidate-policy.json"
        --permit "$RUNNER_TEMP/web-candidate-evidence/root-permit.json" --evidence "$RUNNER_TEMP/web-candidate-evidence" --phase
        build --id step-14 -- pwsh -NoProfile -Command ./scripts/prepare-scb-payment-boundary.ps1
      timeout-minutes: 22
    - name: Qualify reviewed inquiry and localization cases
      run: python3 -B "$WEB_TRANSPORT_ROOT/run_web_candidate_phase.py" --policy "$WEB_TRANSPORT_ROOT/web-candidate-policy.json"
        --permit "$RUNNER_TEMP/web-candidate-evidence/root-permit.json" --evidence "$RUNNER_TEMP/web-candidate-evidence" --phase
        focused --id step-15 -- bash -e -o pipefail -c 'dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
        -c Release --no-build --no-restore -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath= --filter "FullyQualifiedName~QuotationReceiptTempDataHttpTests|FullyQualifiedName~InstantQuotationRequiredLocalizationTests|FullyQualifiedName~LocalizedScanningAccuracyClaimHttpTests|FullyQualifiedName~QuotationPageTests"
        --logger trx --results-directory ./candidate-focused-results'
      timeout-minutes: 22
      shell: bash
    - name: Verify protected ticket currency identity
      run: python3 -B "$WEB_TRANSPORT_ROOT/run_web_candidate_phase.py" --policy "$WEB_TRANSPORT_ROOT/web-candidate-policy.json"
        --permit "$RUNNER_TEMP/web-candidate-evidence/root-permit.json" --evidence "$RUNNER_TEMP/web-candidate-evidence" --phase
        focused --id step-16 -- bash -e -o pipefail -c 'dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
        --configuration Release --no-build --no-restore -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath= --filter "FullyQualifiedName~ProtectedTicket_NonCanonicalCurrencyOrRate_IsRejected|FullyQualifiedName~IssuedTickets_CanonicalThbIdentityAndEngineerReview_RemainValid"
        --logger trx --results-directory ./ticket-test-results'
      timeout-minutes: 22
      shell: bash
    - name: Install pinned Chromium browser
      shell: bash
      run: python3 -B "$WEB_TRANSPORT_ROOT/run_web_candidate_phase.py" --policy "$WEB_TRANSPORT_ROOT/web-candidate-policy.json"
        --permit "$RUNNER_TEMP/web-candidate-evidence/root-permit.json" --evidence "$RUNNER_TEMP/web-candidate-evidence" --phase
        native --id step-17 -- pwsh -NoProfile -Command './Legacy.Maliev.Web.Tests/bin/Release/net10.0/playwright.ps1 install
        --with-deps chromium'
      timeout-minutes: 22
    - name: Verify accepted publisher, original nine meshes and pricing callback budgets
      run: python3 -B "$WEB_TRANSPORT_ROOT/run_web_candidate_phase.py" --policy "$WEB_TRANSPORT_ROOT/web-candidate-policy.json"
        --permit "$RUNNER_TEMP/web-candidate-evidence/root-permit.json" --evidence "$RUNNER_TEMP/web-candidate-evidence" --phase
        focused --id step-18 -- bash -e -o pipefail -c 'dotnet test Legacy.Maliev.Web.Tests/Legacy.Maliev.Web.Tests.csproj
        --configuration Release --no-build --no-restore -p:CI=false -p:VSTestCollect= -p:RunSettingsFilePath= --filter "FullyQualifiedName~PublishWorkflowPermissionContractTests|FullyQualifiedName~NineGeneratedStlUploadsKeepDistinctReviewAndPreliminaryPreviews|FullyQualifiedName~ComparisonCallback"
        --logger trx --results-directory ./publisher-mesh-test-results'
      timeout-minutes: 22
      shell: bash
    - name: Verify localized physical result, actual summary and consent browser boundaries
      run: python3 -B "$WEB_TRANSPORT_ROOT/run_web_candidate_phase.py" --policy "$WEB_TRANSPORT_ROOT/web-candidate-policy.json"
