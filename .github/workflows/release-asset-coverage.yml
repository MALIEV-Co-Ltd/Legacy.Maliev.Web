name: Release asset coverage

on:
  pull_request:
    branches: [main, develop, staging]
    paths:
      - Legacy.Maliev.Web/verify-release-assets.mjs
      - Legacy.Maliev.Web/tests/release-asset-validator.test.mjs
      - Legacy.Maliev.Web/package.json
      - .github/workflows/release-asset-coverage.yml

permissions:
  contents: read

concurrency:
  group: release-asset-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Legacy.Maliev.Web
    steps:
      - name: Check out reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Legacy.Maliev.Web/package-lock.json
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Collect and gate validator coverage
        shell: bash
        env:
          NODE_V8_COVERAGE: ${{ github.workspace }}/runner-results/v8
        run: |
          mkdir -p ../runner-results
          node --experimental-test-coverage --test --test-concurrency=1 --test-coverage-include=**/verify-release-assets.mjs --test-coverage-lines=80 tests/release-asset-validator.test.mjs tests/shared-public-modules.test.mjs | tee ../runner-results/validator-tests.txt
      - name: Preserve synthetic validator evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-validator-${{ github.sha }}
          path: runner-results
          retention-days: 7
          if-no-files-found: warn
