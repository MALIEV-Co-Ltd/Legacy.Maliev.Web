name: Retain hosted validation resource checkpoints
description: Read-only bounded resource checkpoints on the current validation runner.
inputs:
  mode:
    description: Full sampling or the exact hosted feature qualification.
    required: false
    default: full
outputs:
  baseline-artifact-id:
    description: Artifact identity returned after the baseline was persisted.
    value: ${{ steps.upload00.outputs.artifact-id }}
runs:
  using: composite
  steps:
    - name: Sample resource phase 00
      shell: bash
      env:
        RESOURCE_CHECKPOINT_SCOPE: ${{ inputs.mode }}
      run: >-
        exec python3 -B scripts/hosted-validation-resource-checkpoint.py sample
        --directory "$RUNNER_TEMP/web-validation-resources-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$RESOURCE_CHECKPOINT_SCOPE"
        --phase 0
    - name: Preserve resource phase 00
      id: upload00
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: web-validation-resources-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-${{ inputs.mode }}-00
        path: ${{ runner.temp }}/web-validation-resources-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.mode }}/sample-00.json
        retention-days: 7
        if-no-files-found: error
    - name: Sample resource phase 01
      if: inputs.mode != 'qualification-complete'
      shell: bash
      env:
        RESOURCE_CHECKPOINT_SCOPE: ${{ inputs.mode }}
      run: >-
        exec python3 -B scripts/hosted-validation-resource-checkpoint.py sample
        --directory "$RUNNER_TEMP/web-validation-resources-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$RESOURCE_CHECKPOINT_SCOPE"
        --phase 1
    - name: Preserve resource phase 01
      id: upload01
      if: inputs.mode != 'qualification-complete'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
