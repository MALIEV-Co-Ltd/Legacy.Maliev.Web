        path: ${{ runner.temp }}/web-validation-resources-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.mode }}/sample-01.json
        retention-days: 7
        if-no-files-found: error
    - name: Sample resource phase 02
