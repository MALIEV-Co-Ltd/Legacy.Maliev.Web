<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Rotation and feed must be calculated together</title><desc id="desc">A four-edge cutter rotates while translating. Metric equations and a worked example show feed recalculated when spindle speed is capped.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#005bff"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#c5d1e2" stroke-width="1"/></pattern></defs><rect width="960" height="480" rx="16" fill="#f4f7fb"/><g font-family="sans-serif"><rect x="42" y="160" width="355" height="245" rx="8" fill="#e1e9f4" stroke="#071b31" stroke-width="2"/><circle cx="216" cy="240" r="70" fill="white" stroke="#071b31" stroke-width="2"/><circle cx="216" cy="170" r="7" fill="#005bff" stroke="#005bff" stroke-width="2"/><circle cx="286" cy="240" r="7" fill="#005bff" stroke="#005bff" stroke-width="2"/><circle cx="216" cy="310" r="7" fill="#005bff" stroke="#005bff" stroke-width="2"/><circle cx="146" cy="240" r="7" fill="#005bff" stroke="#005bff" stroke-width="2"/><path d="M150 145A114 114 0 0 1 314 216" fill="none" stroke="#005bff" stroke-width="3" marker-end="url(#arrow)"/><text x="197" y="108" fill="#071b31" font-size="24">n</text><path d="M132 350L342 350" fill="none" stroke="#005bff" stroke-width="2.5" marker-end="url(#arrow)"/><text x="220" y="388" fill="#071b31" font-size="24">vf</text><path d="M146 240L286 240" fill="none" stroke="#005bff" stroke-width="2"/><text x="204" y="228" fill="#071b31" font-size="24">D</text><circle cx="66" cy="65" r="19" fill="#005bff" stroke="#005bff" stroke-width="2"/><text x="59" y="73" fill="white" font-size="23">1</text><circle cx="468" cy="65" r="19" fill="#005bff" stroke="#005bff" stroke-width="2"/><text x="461" y="73" fill="white" font-size="23">2</text><text x="454" y="112" fill="#071b31" font-size="27">n = 1000Vc / (πD)</text><text x="454" y="159" fill="#071b31" font-size="27">vf = fz × n × zc</text><text x="454" y="220" fill="#071b31" font-size="23">D = 10 mm · Vc = 120 m/min</text><text x="454" y="262" fill="#071b31" font-size="23">fz = 0.04 mm/tooth · zc = 4</text><text x="454" y="314" fill="#071b31" font-size="24">n = 3819.7 → vf = 611.2</text><text x="454" y="371" fill="#071b31" font-size="26">n = 3000 → vf = 480</text><text x="454" y="416" fill="#071b31" font-size="22">n (rpm) → vf (mm/min)</text></g></svg>