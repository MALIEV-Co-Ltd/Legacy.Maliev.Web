<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">Blind thread, through hole and counterbore requirements</title>
<desc id="desc">Illustrative section views. h1 measures total drill-point depth. h2 measures required full-thread depth, ending before the drilled bottom. Simplified internal-thread envelopes are shown, not individual teeth. Diameter dimensions span the through bore and counterbore walls; h3 spans the counterbore recess depth. Not a complete production drawing.</desc>
