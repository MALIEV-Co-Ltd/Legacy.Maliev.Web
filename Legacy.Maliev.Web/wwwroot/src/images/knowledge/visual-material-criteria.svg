<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">Material selection conditions</title>
<desc id="desc">Three illustrative sketches show load and deflection, actual fluid and temperature exposure, and a concentric round shaft within a hole. Diametral clearance c equals hole diameter D minus shaft diameter d. For concentric parts the radial gap is c divided by two. The depicted gap is exaggerated; this is not a fit specification.</desc>
