<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">Different inputs communicate different information</title>
<desc id="desc">A digital model identifies nominal geometry and revision 02. A drawing adds an illustrative 60 plus or minus 0.10 millimetre width at the same revision. A physical sample is inspected for actual condition; its original dimensions and revision are not assumed.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#005bff"/></marker>
  <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#a6b7cc" stroke-width="1"/></pattern>
  <g id="plate"><path d="M0 45L88 0L180 48L92 93Z" fill="#e1e9f4" stroke="#071b31" stroke-width="2.5"/><path d="M0 45V68L92 116V93M92 116L180 71V48" fill="none" stroke="#071b31" stroke-width="2.5"/><ellipse cx="90" cy="47" rx="17" ry="10" fill="white" stroke="#071b31" stroke-width="2"/></g>
</defs>
<rect width="960" height="480" rx="16" fill="#f4f7fb"/>
<g font-family="Arial, sans-serif">
<circle cx="68" cy="56" r="19" fill="#005bff"/><text x="68" y="64" font-size="23" text-anchor="middle" fill="white">1</text><circle cx="375" cy="56" r="19" fill="#005bff"/><text x="375" y="64" font-size="23" text-anchor="middle" fill="white">2</text><circle cx="690" cy="56" r="19" fill="#005bff"/><text x="690" y="64" font-size="23" text-anchor="middle" fill="white">3</text><use href="#plate" transform="translate(64 176) scale(1.1)"/><text x="164" y="348" font-size="22" text-anchor="middle" fill="#071b31">REV 02</text><rect x="346" y="115" width="232" height="250" fill="white" stroke="#9badc2" stroke-width="2"/><rect x="382" y="158" width="160" height="106" fill="#f4f7fb" stroke="#071b31" stroke-width="2"/><circle cx="462" cy="211" r="13.3" fill="white" stroke="#071b31" stroke-width="2"/><path d="M462 182L462 240" fill="none" stroke="#53627b" stroke-width="1.6" stroke-dasharray="14 4 2 4"/><path d="M432 211L492 211" fill="none" stroke="#53627b" stroke-width="1.6" stroke-dasharray="14 4 2 4"/><path d="M382 272L382 313" fill="none" stroke="#53627b" stroke-width="1.6"/><path d="M542 272L542 313" fill="none" stroke="#53627b" stroke-width="1.6"/><path d="M382 301L542 301" fill="none" stroke="#005bff" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="462" y="291" font-size="20" text-anchor="middle" fill="#071b31">60 ±0.10</text><text x="462" y="344" font-size="18" text-anchor="middle" fill="#071b31">mm · REV 02</text><use href="#plate" transform="translate(690 179) scale(1.1)"/><path d="M714 224l12 6 8-4 10 8 10-3" fill="none" stroke="#53627b" stroke-width="3"/><circle cx="833" cy="337" r="28" fill="none" stroke="#005bff" stroke-width="2.5"/><path d="M853 357L875 379" fill="none" stroke="#005bff" stroke-width="3"/>
</g>
</svg>
