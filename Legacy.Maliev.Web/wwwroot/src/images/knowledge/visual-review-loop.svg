<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">Review and approval follow the controlled revision</title>
<desc id="desc">Four schematic stages show design, review, an optional prototype, and approval of the same identified revision 02. Any change returns to review before approval; a new revision is not automatically approved by making a prototype.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#005bff"/></marker>
  <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#a6b7cc" stroke-width="1"/></pattern>
  <g id="plate"><path d="M0 45L88 0L180 48L92 93Z" fill="#e1e9f4" stroke="#071b31" stroke-width="2.5"/><path d="M0 45V68L92 116V93M92 116L180 71V48" fill="none" stroke="#071b31" stroke-width="2.5"/><ellipse cx="90" cy="47" rx="17" ry="10" fill="white" stroke="#071b31" stroke-width="2"/></g>
</defs>
<rect width="960" height="480" rx="16" fill="#f4f7fb"/>
<g font-family="Arial, sans-serif">
<rect x="52" y="111" width="164" height="227" fill="white" stroke="#9badc2" stroke-width="2"/><circle cx="74" cy="56" r="19" fill="#005bff"/><text x="74" y="64" font-size="23" text-anchor="middle" fill="white">1</text><rect x="285" y="111" width="164" height="227" fill="white" stroke="#9badc2" stroke-width="2"/><circle cx="307" cy="56" r="19" fill="#005bff"/><text x="307" y="64" font-size="23" text-anchor="middle" fill="white">2</text><rect x="518" y="111" width="164" height="227" fill="white" stroke="#9badc2" stroke-width="2"/><circle cx="540" cy="56" r="19" fill="#005bff"/><text x="540" y="64" font-size="23" text-anchor="middle" fill="white">3</text><rect x="751" y="111" width="164" height="227" fill="white" stroke="#9badc2" stroke-width="2"/><circle cx="773" cy="56" r="19" fill="#005bff"/><text x="773" y="64" font-size="23" text-anchor="middle" fill="white">4</text><use href="#plate" transform="translate(64 183) scale(.77)"/><use href="#plate" transform="translate(530 183) scale(.77)"/><text x="134" y="315" font-size="20" text-anchor="middle" fill="#071b31">REV 02</text><text x="600" y="315" font-size="20" text-anchor="middle" fill="#071b31">REV 02</text><circle cx="367" cy="222" r="35" fill="none" stroke="#005bff" stroke-width="2"/><path d="M346 223l13 13 28-32M798 223l13 13 28-32" fill="none" stroke="#005bff" stroke-width="4"/><text x="833" y="315" font-size="20" text-anchor="middle" fill="#071b31">REV 02</text><path d="M224 222H269" stroke="#005bff" stroke-width="2" marker-end="url(#arrow)"/><path d="M457 222H502" stroke="#005bff" stroke-width="2" marker-end="url(#arrow)"/><path d="M690 222H735" stroke="#005bff" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 348V390H367V349" fill="none" stroke="#005bff" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="425" font-size="20" text-anchor="middle" fill="#071b31">CHANGE → REVIEW AGAIN</text>
</g>
</svg>
