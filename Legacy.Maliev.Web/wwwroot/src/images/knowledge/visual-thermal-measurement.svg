<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Thermal expansion calculation</title><desc id="desc">An assumed 100 mm length at 20 degrees Celsius increases by 0.012 mm for a uniform ten degree rise using an assumed expansion coefficient of twelve times ten to the minus six per kelvin.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8" fill="#005bff"/></marker></defs><rect width="960" height="480" fill="#f4f7fb"/><g font-family="Arial, sans-serif" stroke="#071b31" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><circle cx="70" cy="62" r="21" fill="#071b31" stroke="none"/><text x="62" y="71" fill="white" font-size="25" stroke="none">1</text><text x="111" y="71" fill="#071b31" font-size="30" stroke="none">20 °C</text><rect x="80" y="128" width="680" height="48" fill="white" /><line x1="80" y1="190" x2="80" y2="220" stroke="#53627b"/><line x1="760" y1="190" x2="760" y2="220" stroke="#53627b"/><line x1="80" y1="208" x2="760" y2="208" stroke="#005bff"/><text x="352" y="245" fill="#071b31" font-size="28" stroke="none">L = 100 mm</text><circle cx="70" cy="295" r="21" fill="#071b31" stroke="none"/><text x="62" y="304" fill="white" font-size="25" stroke="none">2</text><text x="111" y="305" fill="#071b31" font-size="30" stroke="none">30 °C</text><rect x="80" y="328" width="727" height="48" fill="white" stroke="#005bff"/><line x1="760" y1="110" x2="760" y2="397" stroke="#53627b" stroke-dasharray="6 8"/><line x1="807" y1="313" x2="807" y2="397" stroke="#005bff"/><text x="780" y="427" fill="#071b31" font-size="26" stroke="none">ΔL</text><text x="80" y="458" fill="#071b31" font-size="29" stroke="none">α = 12 × 10⁻⁶ /K     ΔL = α L ΔT = 0.012 mm</text></g></svg>