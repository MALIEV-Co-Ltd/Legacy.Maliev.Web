<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Supported overhang differs from cutting length</title><desc id="desc">A holder supports the upper shank. The exposed length from the holder face to the tip is longer than the fluted cutting region. A sectional pocket shows why clearance must be checked.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#005bff"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#c5d1e2" stroke-width="1"/></pattern></defs><rect width="960" height="480" rx="16" fill="#f4f7fb"/><g font-family="sans-serif"><rect x="325" y="60" width="160" height="110" rx="8" fill="#d6e0ed" stroke="#071b31" stroke-width="2"/><rect x="373" y="170" width="64" height="195" rx="8" fill="white" stroke="#071b31" stroke-width="2"/><rect x="373" y="285" width="64" height="80" rx="8" fill="#e1e9f4" stroke="#005bff" stroke-width="2"/><path d="M378 355L397 295" fill="none" stroke="#005bff" stroke-width="2"/><path d="M396 355L415 295" fill="none" stroke="#005bff" stroke-width="2"/><path d="M414 355L433 295" fill="none" stroke="#005bff" stroke-width="2"/><path d="M255 253H300V389H510V253H555V425H255Z" fill="url(#hatch)" stroke="#071b31" stroke-width="2"/><path d="M295 170L575 170" fill="none" stroke="#53627b" stroke-width="2" stroke-dasharray="7 6"/><path d="M300 285L575 285" fill="none" stroke="#53627b" stroke-width="2" stroke-dasharray="7 6"/><path d="M300 365L575 365" fill="none" stroke="#53627b" stroke-width="2" stroke-dasharray="7 6"/><path d="M575 170L575 365" fill="none" stroke="#005bff" stroke-width="2"/><path d="M566 170L584 170" fill="none" stroke="#005bff" stroke-width="2"/><path d="M566 365L584 365" fill="none" stroke="#005bff" stroke-width="2"/><text x="597" y="267" fill="#071b31" font-size="24">Lₒ</text><circle cx="